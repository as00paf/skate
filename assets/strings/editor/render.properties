# Render Graph window (EDT-54)
help.render_graph.what=The render passes that draw each frame, in the order they run, with the resources they read and write and how long each one takes on the GPU and CPU.
help.render_graph.how=Click a pass to see its details and timing history. Use the checkbox on a pass to switch it off for this session (the lock marks passes that must run). Expand Post-Processing to switch single effects. Middle- or right-drag to pan, use the wheel to zoom, and Fit to frame the graph.
help.render_graph.related=The Profiler shows the whole frame; Editor Settings holds the graphics quality.
lbl.render_graph.fit=Fit
lbl.render_graph.fit.tooltip=Zoom and pan so the whole graph fits in the window.
lbl.render_graph.actual_size=1:1
lbl.render_graph.actual_size.tooltip=Show the graph at its actual size.
lbl.render_graph.frame_cpu=CPU %s
lbl.render_graph.frame_gpu=GPU %s
tooltip.render_graph.frame_gpu=Sum of the per-pass GPU timers (there is no whole-frame timer). GPU times arrive a few frames late.
lbl.render_graph.passes_enabled=%d/%d passes
lbl.render_graph.no_timers=No GPU timers
tooltip.render_graph.no_timers=This graphics driver has no GPU timer queries: bars and totals use CPU time.
lbl.render_graph.timing=GPU %s  CPU %s
lbl.render_graph.off=Off
lbl.render_graph.on_demand=On demand
lbl.render_graph.last=last %s
lbl.render_graph.hint=Middle- or right-drag to pan, wheel to zoom, click a pass for details.
lbl.render_graph.passes_off=Passes off: %d
lbl.render_graph.enable_all=Enable all
lbl.render_graph.enable_all.tooltip=Switch every pass back on.
lbl.render_graph.picking_off=Click-select in the viewport is off
lbl.render_graph.no_passes.hint=The renderer has not built its passes yet. Open a scene to start rendering.
lbl.render_graph.history_gpu=GPU time, last %d frames
lbl.render_graph.history_cpu=CPU time, last %d frames
lbl.render_graph.avg_max=Average %s, max %s
tooltip.render_graph.toggle=Switch this pass on or off for this editor session. Exported games always run every pass.
tooltip.render_graph.toggle_picking=Switch picking on or off for this session. While it is off, clicking in the viewport does not select objects.
tooltip.render_graph.required=Required: this pass cannot be switched off.
tooltip.render_graph.on_demand=Runs only when the editor needs to know what is under the mouse, so most frames have no time. The last measured time is shown.
tooltip.render_graph.expand=Show or hide the effects of this pass.
tooltip.render_graph.stage=Switch this effect on or off.
tooltip.render_graph.stage_inactive=This effect cannot run here: post-processing needs the scene framebuffer.
tooltip.render_graph.no_writer=%s: no earlier pass writes this resource.
tooltip.render_graph.resource=%s: click to highlight its links.
tooltip.render_graph.close_details=Close the details panel.
