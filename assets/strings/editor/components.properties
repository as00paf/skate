# Component Properties
component.AmbientLightComponent.lightColor=Light Color
component.AmbientLightComponent.lightColor.tooltip=Color of the ambient light applied evenly to every surface, independent of direction.
component.AmbientLightComponent.intensity=Light Intensity
component.AmbientLightComponent.intensity.tooltip=Brightness of the uniform ambient light that fills shadows. 0 = none, higher values brighten the whole scene.
component.DirectionalLightComponent.direction=Light Direction
component.DirectionalLightComponent.direction.tooltip=Direction the light travels in, as a world vector. (0, -1, 0) shines straight down.
component.DirectionalLightComponent.color=Light Color
component.DirectionalLightComponent.color.tooltip=Color of the sunlight emitted by this light.
component.DirectionalLightComponent.intensity=Light Intensity
component.DirectionalLightComponent.intensity.tooltip=Brightness multiplier of the light. 0 = off, 1 = normal, higher values are brighter.
component.DirectionalLightComponent.castShadows=Cast Shadows
component.DirectionalLightComponent.castShadows.tooltip=Renders a shadow map so objects lit by this light cast shadows.
component.DirectionalLightComponent.orthoNear=Ortho Near
component.DirectionalLightComponent.orthoNear.tooltip=Near depth of the shadow projection box, in world units. Used when auto bounds is off.
component.DirectionalLightComponent.orthoFar=Ortho Far
component.DirectionalLightComponent.orthoFar.tooltip=Far depth of the shadow projection box, in world units. Used when auto bounds is off.
component.DirectionalLightComponent.orthoLeft=Ortho Left
component.DirectionalLightComponent.orthoLeft.tooltip=Left edge of the shadow projection box, in world units. Used when auto bounds is off.
component.DirectionalLightComponent.orthoRight=Ortho Right
component.DirectionalLightComponent.orthoRight.tooltip=Right edge of the shadow projection box, in world units. Used when auto bounds is off.
component.DirectionalLightComponent.orthoTop=Ortho Top
component.DirectionalLightComponent.orthoTop.tooltip=Top edge of the shadow projection box, in world units. Used when auto bounds is off.
component.DirectionalLightComponent.orthoBottom=Ortho Bottom
component.DirectionalLightComponent.orthoBottom.tooltip=Bottom edge of the shadow projection box, in world units. Used when auto bounds is off.
component.DirectionalLightComponent.shadowDistance=Shadow Distance
component.DirectionalLightComponent.shadowDistance.tooltip=Distance from the camera, in metres, up to which shadows are drawn. Lower values give sharper shadows.
component.DirectionalLightComponent.depthBias=Depth Bias
component.DirectionalLightComponent.depthBias.tooltip=Depth offset applied to shadows to remove shadow acne. Too high detaches shadows from objects.
component.DirectionalLightComponent.slopeScaledBias=Slope Scaled Bias
component.DirectionalLightComponent.slopeScaledBias.tooltip=Extra shadow offset on surfaces at grazing angles to the light. Raise it if slopes show acne.
component.DirectionalLightComponent.autoCalculateBounds=Auto-Calculate Bounds
component.DirectionalLightComponent.autoCalculateBounds.tooltip=Fits the shadow area to the camera view up to the shadow distance instead of using the Ortho values.
component.DirectionalLightComponent.stabilizeProjection=Stabilize Projection
component.DirectionalLightComponent.stabilizeProjection.tooltip=Snaps the shadow map to texels so shadow edges do not shimmer when the camera moves.
component.PointLightComponent.color=Light Color
component.PointLightComponent.color.tooltip=RGB color of the light emitted by this point light.
component.PointLightComponent.intensity=Light Intensity
component.PointLightComponent.intensity.tooltip=Brightness multiplier of the light. 0 = off, higher = brighter.
component.PointLightComponent.constant=Constant
component.PointLightComponent.constant.tooltip=Constant attenuation term. Usually 1; higher values dim the light everywhere.
component.PointLightComponent.linear=Linear
component.PointLightComponent.linear.tooltip=Linear attenuation term. Higher values make the light fade faster with distance.
component.PointLightComponent.quadratic=Quadratic
component.PointLightComponent.quadratic.tooltip=Quadratic attenuation term. Higher values shorten the light's range sharply.
component.SpotLightComponent.direction=Direction
component.SpotLightComponent.direction.tooltip=Direction the spot light points, as a vector. Default is straight down.
component.SpotLightComponent.constant=Constant
component.SpotLightComponent.constant.tooltip=Constant attenuation term. Usually 1; higher values dim the light everywhere.
component.SpotLightComponent.linear=Linear
component.SpotLightComponent.linear.tooltip=Linear attenuation term. Higher values make the light fade faster with distance.
component.SpotLightComponent.quadratic=Quadratic
component.SpotLightComponent.quadratic.tooltip=Quadratic attenuation term. Higher values shorten the light's range sharply.
component.SpotLightComponent.color=Light Color
component.SpotLightComponent.color.tooltip=RGB color of the light emitted by this spot light.
component.SpotLightComponent.intensity=Light Intensity
component.SpotLightComponent.intensity.tooltip=Brightness multiplier of the light. 0 = off, higher = brighter.
component.SpotLightComponent.cutOff=CutOff
component.SpotLightComponent.cutOff.tooltip=Inner cone angle in degrees; full brightness inside it.
component.SpotLightComponent.outerCutOff=Outer CutOff
component.SpotLightComponent.outerCutOff.tooltip=Outer cone angle in degrees; light fades to zero between the inner and outer angles.
component.Transform.translation=Translation
component.Transform.translation.tooltip=Position relative to the parent object, in world units.
component.Transform.rotation=Rotation
component.Transform.rotation.tooltip=Local rotation in degrees around X (pitch), Y (yaw) and Z (roll).
component.Transform.scale=Scale
component.Transform.scale.tooltip=Local scale factor on each axis. 1 = original size.
component.RigidBody3D.mass=Mass
component.RigidBody3D.mass.tooltip=Body mass in kilograms. Heavier bodies are harder to push. Ignored for static bodies.
component.RigidBody3D.bodyType=Body Type
component.RigidBody3D.bodyType.tooltip=Static never moves, Dynamic is driven by physics, Kinematic is moved by code.
component.RigidBody3D.useCCD=Use CCD
component.RigidBody3D.useCCD.tooltip=Continuous collision detection: stops fast bodies from passing through thin objects.
component.RigidBody3D.friction=Friction
component.RigidBody3D.friction.tooltip=Surface friction against other bodies. 0 = slippery, higher values grip more.
component.RigidBody3D.linearDamping=Linear Damping
component.RigidBody3D.linearDamping.tooltip=Slows movement over time like air drag. 0 = no damping, higher values stop faster.
component.RigidBody3D.angularDamping=Angular Damping
component.RigidBody3D.angularDamping.tooltip=Slows rotation over time. 0 = no damping, higher values stop spinning faster.
component.RenderComponent.castShadow=Cast Shadow
component.RenderComponent.castShadow.tooltip=Makes this model cast shadows onto other surfaces.
component.RenderComponent.receiveShadow=Receive Shadow
component.RenderComponent.receiveShadow.tooltip=Lets shadows from other objects appear on this model.
component.RenderComponent.textureScale=Texture Scale
component.RenderComponent.textureScale.tooltip=Multiplier for texture tiling on the model. Higher values repeat the texture more.
component.RenderComponent.renderMode=Render Mode
component.RenderComponent.renderMode.tooltip=What to draw: the mesh, its skeleton bones, or both.
component.SpriteRenderer.color=Base Color
component.SpriteRenderer.color.tooltip=Tint and alpha multiplied with the sprite texture. White keeps the original colors.
component.SpriteRenderer.zIndex=zIndex
component.SpriteRenderer.zIndex.tooltip=2D draw order. Sprites with a higher zIndex are drawn on top.
component.SpriteRenderer.texture=Texture
component.SpriteRenderer.texture.tooltip=Image or sprite texture drawn by this renderer, tinted by the base color.
component.BoxCollider3D.halfExtents=Half Extents
component.BoxCollider3D.halfExtents.tooltip=Half the box size along each local axis, in world units. 1 gives a 2 x 2 x 2 box.
component.BoxCollider3D.margin=Margin
component.BoxCollider3D.margin.tooltip=Collision margin added around the shape, in world units. Small values keep contacts stable.
component.BoxCollider3D.offset=Offset
component.BoxCollider3D.offset.tooltip=Position of the box center relative to the GameObject, in world units.
component.CameraComponent.isOrthographic=Orthographic
component.CameraComponent.isOrthographic.tooltip=Uses an orthographic projection with no perspective: objects keep their size at any distance.
component.CameraComponent.fov=Field of View
component.CameraComponent.fov.tooltip=Vertical field of view in degrees. Higher values show more of the scene with more distortion.
component.CameraComponent.nearPlane=Near Plane
component.CameraComponent.nearPlane.tooltip=Closest distance the camera renders, in metres. Too small a value causes depth artifacts.
component.CameraComponent.farPlane=Far Plane
component.CameraComponent.farPlane.tooltip=Farthest distance the camera renders, in metres. Objects beyond it are clipped.
component.CameraComponent.zoom=Zoom
component.CameraComponent.zoom.tooltip=Multiplies the field of view (or orthographic size). Below 1 zooms in, above 1 zooms out.
component.CameraComponent.isDefault=Default
component.CameraComponent.isDefault.tooltip=Makes this the camera used when the scene runs. Otherwise the first camera found is used.
component.DayNightCycleComponent.timeOfDay=Time of Day
component.DayNightCycleComponent.timeOfDay.tooltip=Current hour of the cycle, from 0 to 24. 12 is noon; it sets the sun position and color.
component.DayNightCycleComponent.dayDuration=Day Duration
component.DayNightCycleComponent.dayDuration.tooltip=Real seconds for a full 24-hour cycle (60 to 600). Lower values make days pass faster.
component.DayNightCycleComponent.shadowIntensity=Shadow Intensity
component.DayNightCycleComponent.shadowIntensity.tooltip=Shadow strength set by the cycle: 1 during the day, lower at night. 0 = no shadows.
component.DayNightCycleComponent.isDaytime=Daytime
component.DayNightCycleComponent.isDaytime.tooltip=Read-only: shows whether the current time is between 6:00 and 18:00.
component.DayNightCycleComponent.autoAmbient=Auto-Ambient Mode
component.DayNightCycleComponent.autoAmbient.tooltip=Blends the scene ambient light between the night and day ambient colors as time passes.
component.DayNightCycleComponent.timeScale=Time Scale
component.DayNightCycleComponent.timeScale.tooltip=Speed multiplier for the cycle. 1 = normal, 0 = paused, higher values speed time up.
component.ScenePhysicsComponent.debugEnabled=Debug Mode
component.ScenePhysicsComponent.debugEnabled.tooltip=Draws physics colliders and debug shapes in the viewport.
component.ScenePhysicsComponent.gravity=Gravity
component.ScenePhysicsComponent.gravity.tooltip=Scene gravity acceleration in meters per second squared. Default is 0, -9.81, 0.
component.GridLines.majorStep=Major Step
component.GridLines.majorStep.tooltip=Spacing in metres between major grid lines.
component.GridLines.minorStep=Minor Step
component.GridLines.minorStep.tooltip=Spacing between minor grid lines, in world units (1 = one meter).
component.GridLines.majorColor=Major Color
component.GridLines.majorColor.tooltip=Color of the major grid lines drawn every major step.
component.GridLines.minorColor=Minor Color
component.GridLines.minorColor.tooltip=Color of the thin grid lines drawn between major lines.
component.GridLines.minExtent=Minimum Extent
component.GridLines.minExtent.tooltip=Smallest half-size of the editor grid when the camera is close, in world units.
component.GridLines.maxExtent=Maximum Extent
component.GridLines.maxExtent.tooltip=Largest half-size the editor grid can grow to as the camera moves away, in world units.
component.GridLines.lodCloseDistance=LOD Close Distance
component.GridLines.lodCloseDistance.tooltip=Camera distance in metres up to which minor lines are fully visible before they start fading.
component.GridLines.lodFarDistance=LOD Far Distance
component.GridLines.lodFarDistance.tooltip=Camera distance in metres at which minor lines have fully faded out.
component.GridLines.showGrid=Show Grid
component.GridLines.showGrid.tooltip=Shows or hides the reference grid in the editor viewport.
component.GridLines.showOriginAxes=Show Origin Axes
component.GridLines.showOriginAxes.tooltip=Draws the colored X and Z axes through the world origin when the camera is near.
component.GridLines.gridYOffset=Grid Y-Offset
component.GridLines.gridYOffset.tooltip=Height of the grid plane in world units. 0 places it at the world origin.
component.GridLines.showCenterMarker=Show Center Marker
component.GridLines.showCenterMarker.tooltip=Shows a marker at the world origin when the camera is close enough.
component.GridLines.centerMarkerColor=Center Marker Color
component.GridLines.centerMarkerColor.tooltip=Color of the marker drawn at the grid center.
component.GridLines.centerMarkerDistance=Center Marker Distance
component.GridLines.centerMarkerDistance.tooltip=Camera distance in metres below which the center marker is shown.
component.GridLines.edgeFadeEnabled=Edge Fade Enabled
component.GridLines.edgeFadeEnabled.tooltip=Fades the grid lines out toward the outer edge of the grid.
component.GridLines.edgeFadeStart=Edge Fade Start
component.GridLines.edgeFadeStart.tooltip=Fraction of the grid extent where edge fading begins, from 0 to 1. Lower starts fading sooner.
component.GridLines.secondaryGridEnabled=Secondary Grid
component.GridLines.secondaryGridEnabled.tooltip=Draws a second grid plane at the height set by Secondary Grid-Y.
component.GridLines.secondaryGridY=Secondary Grid-Y
component.GridLines.secondaryGridY.tooltip=Height of the secondary grid plane, in world units.
component.GridLines.secondaryGridColor=Secondary Grid Color
component.GridLines.secondaryGridColor.tooltip=Line color of the optional secondary grid drawn at another height.
component.GridLines.snapVisualizationEnabled=Snap Visualization
component.GridLines.snapVisualizationEnabled.tooltip=Draws markers at the major grid intersections that objects snap to.
component.GridLines.snapMarkerColor=Snap Marker Color
component.GridLines.snapMarkerColor.tooltip=Color of the markers showing snap points on the major grid.
component.GridLines.originAxesThickness=origin Axes Thickness
component.GridLines.originAxesThickness.tooltip=Thickness of the colored X and Z axis lines through the world origin, in world units.
component.EnvironmentComponent.skyColor=Sky Color
component.EnvironmentComponent.skyColor.tooltip=Background sky color used when no sky texture is set.
component.EnvironmentComponent.skyTint=Sky Tint
component.EnvironmentComponent.skyTint.tooltip=Color multiplied with the sky texture. White leaves it unchanged.
component.EnvironmentComponent.skyExposure=Sky Exposure
component.EnvironmentComponent.skyExposure.tooltip=Brightness multiplier for the sky texture. 1 = unchanged, higher values brighten it.
component.EnvironmentComponent.skyRotation=Sky Rotation
component.EnvironmentComponent.skyRotation.tooltip=Rotation of the sky texture around the vertical axis, in degrees.
component.EnvironmentComponent.skyTexture=Sky Texture
component.EnvironmentComponent.skyTexture.tooltip=Panoramic (HDRI) image drawn as the sky dome. Empty uses the sky color.
component.EnvironmentComponent.fogColor=Fog Color
component.EnvironmentComponent.fogColor.tooltip=Color that distant objects fade into as fog thickens.
component.EnvironmentComponent.fogDensity=Fog Density
component.EnvironmentComponent.fogDensity.tooltip=Fog density per metre for the exponential modes. 0 = no fog, higher values thicken it.
component.EnvironmentComponent.renderSky=Render Sky
component.EnvironmentComponent.renderSky.tooltip=Draws the sky (texture or sky color) behind the scene. Off leaves a plain background.
component.EnvironmentComponent.renderFog=Render Fog
component.EnvironmentComponent.renderFog.tooltip=Applies distance fog to the scene. Off disables fog regardless of its density.
component.DayNightCycleComponent.noonColor=Noon Color
component.DayNightCycleComponent.noonColor.tooltip=Sunlight color in the middle of the day, when the sun is at its highest.
component.DayNightCycleComponent.duskColor=Dusk Color
component.DayNightCycleComponent.duskColor.tooltip=Sunlight color around sunset (18:00), blended from noon toward the night color.
component.DayNightCycleComponent.nightColor=Night Color
component.DayNightCycleComponent.nightColor.tooltip=Light color at night, used as moonlight between dusk and dawn.
component.DayNightCycleComponent.dawnColor=Dawn Color
component.DayNightCycleComponent.dawnColor.tooltip=Sunlight color around sunrise (6:00), blended from the night color toward noon.
component.DayNightCycleComponent.dayAmbient=Day Ambient Color
component.DayNightCycleComponent.dayAmbient.tooltip=Ambient light color used in full daylight when auto-ambient mode is on.
component.DayNightCycleComponent.nightAmbient=Night Ambient Color
component.DayNightCycleComponent.nightAmbient.tooltip=Ambient light color used at night when auto-ambient mode is on.

# UI authoring (GUI-03)
component.JointComponent.jointType=Joint Type
component.JointComponent.jointType.tooltip=Constraint kind: fixed, hinge, cone-twist, slider or six degrees of freedom.
component.JointComponent.connectedBody=Connected Body
component.JointComponent.connectedBody.tooltip=Rigid body this joint attaches to. World pins it to a fixed point in the scene.
component.JointComponent.worldAnchor=World (static anchor)
component.JointComponent.worldAnchor.tooltip=No connected body: the joint holds this object to a fixed point in the world.
component.JointComponent.anchor=Anchor
component.JointComponent.anchor.tooltip=Joint pivot point in this body's local space, in world units.
component.JointComponent.connectedAnchor=Connected Anchor
component.JointComponent.connectedAnchor.tooltip=Joint pivot point in the connected body's local space, in world units.
component.JointComponent.axis=Axis
component.JointComponent.axis.tooltip=Hinge rotation axis or slider travel direction, in this body's local space.
component.JointComponent.connectedAxis=Connected Axis
component.JointComponent.connectedAxis.tooltip=Matching hinge or slider axis in the connected body's local space.
component.JointComponent.limitMin=Limit Min
component.JointComponent.limitMin.tooltip=Lower limit: hinge angle in radians, or slider travel in world units.
component.JointComponent.limitMax=Limit Max
component.JointComponent.limitMax.tooltip=Upper limit: hinge angle in radians, or slider travel in world units.
component.JointComponent.swingSpan1=Swing Span 1
component.JointComponent.swingSpan1.tooltip=Maximum swing angle around the first cone axis, in radians.
component.JointComponent.swingSpan2=Swing Span 2
component.JointComponent.swingSpan2.tooltip=Maximum swing angle around the second cone axis, in radians.
component.JointComponent.twistSpan=Twist Span
component.JointComponent.twistSpan.tooltip=Maximum twist angle around the joint's main axis, in radians.
component.JointComponent.linearLower=Linear Lower
component.JointComponent.linearLower.tooltip=Lower translation limit per axis (X, Y, Z), in world units. Equal to upper locks the axis.
component.JointComponent.linearUpper=Linear Upper
component.JointComponent.linearUpper.tooltip=Upper translation limit per axis (X, Y, Z), in world units.
component.JointComponent.angularLower=Angular Lower
component.JointComponent.angularLower.tooltip=Lower rotation limit per axis (X, Y, Z), in radians. Lower greater than upper leaves the axis free.
component.JointComponent.angularUpper=Angular Upper
component.JointComponent.angularUpper.tooltip=Upper rotation limit per axis (X, Y, Z), in radians.
component.ReverbZone.preset=Preset
component.ReverbZone.preset.tooltip=Reverb character applied inside the zone, such as room or hall.
component.ReverbZone.radius=Radius
component.ReverbZone.radius.tooltip=Radius of the spherical zone around the object, in world units.
component.ReverbZone.priority=Priority
component.ReverbZone.priority.tooltip=When zones overlap, the highest priority wins; ties go to the nearest center.
component.ReverbZone.sendLevel=Send Level
component.ReverbZone.sendLevel.tooltip=Amount of reverb applied while the listener is inside. 0 = none, 1 = full.
component.ReverbZone.lowPassGainHF=Low-pass Gain HF
component.ReverbZone.lowPassGainHF.tooltip=High-frequency gain applied inside the zone. 1 = no filtering, lower = more muffled.
component.ParticleEmitter.playOnStart=Play On Start
component.ParticleEmitter.playOnStart.tooltip=Starts emitting automatically when the scene starts running.
component.ParticleEmitter.looping=Looping
component.ParticleEmitter.looping.tooltip=Restarts emission after each duration cycle. Off emits for one cycle only.
component.ParticleEmitter.duration=Duration (s)
component.ParticleEmitter.duration.tooltip=Length of one emission cycle, in seconds. Looping emitters restart after it.
component.ParticleEmitter.maxParticles=Max Particles
component.ParticleEmitter.maxParticles.tooltip=Maximum particles alive at once. New ones are skipped when the limit is reached.
component.ParticleEmitter.emissionRate=Emission Rate (/s)
component.ParticleEmitter.emissionRate.tooltip=Particles spawned per second while the emitter plays.
component.ParticleEmitter.burstCount=Burst Count
component.ParticleEmitter.burstCount.tooltip=Particles spawned at once when the emitter starts. 0 = no burst.
component.ParticleEmitter.shape=Shape
component.ParticleEmitter.shape.tooltip=Where particles spawn and which way they start moving: point, sphere, box or cone.
component.ParticleEmitter.shapeRadius=Shape Radius
component.ParticleEmitter.shapeRadius.tooltip=Radius of the sphere or cone base particles spawn from, in world units.
component.ParticleEmitter.coneAngle=Cone Angle
component.ParticleEmitter.coneAngle.tooltip=Spread of the cone shape around +Y, in degrees. 0 = straight up.
component.ParticleEmitter.boxSize=Box Size
component.ParticleEmitter.boxSize.tooltip=Size of the box shape particles spawn inside, in world units.
component.ParticleEmitter.lifetimeMin=Lifetime Min
component.ParticleEmitter.lifetimeMin.tooltip=Shortest time a particle can live, in seconds.
component.ParticleEmitter.lifetimeMax=Lifetime Max
component.ParticleEmitter.lifetimeMax.tooltip=Longest time a particle can live, in seconds.
component.ParticleEmitter.speedMin=Speed Min
component.ParticleEmitter.speedMin.tooltip=Lowest initial particle speed, in world units per second.
component.ParticleEmitter.speedMax=Speed Max
component.ParticleEmitter.speedMax.tooltip=Highest initial particle speed, in world units per second.
component.ParticleEmitter.endSpeedScale=End Speed Scale
component.ParticleEmitter.endSpeedScale.tooltip=Speed multiplier reached at the end of life. 1 = constant speed, 0 = slows to a stop.
component.ParticleEmitter.gravity=Gravity
component.ParticleEmitter.gravity.tooltip=World-space acceleration applied to every particle, in units per second squared.
component.ParticleEmitter.startSize=Start Size
component.ParticleEmitter.startSize.tooltip=Particle size when it spawns, in world units.
component.ParticleEmitter.endSize=End Size
component.ParticleEmitter.endSize.tooltip=Particle size at the end of its life, in world units.
component.ParticleEmitter.startColor=Start Color
component.ParticleEmitter.startColor.tooltip=Particle color and alpha when it spawns.
component.ParticleEmitter.endColor=End Color
component.ParticleEmitter.endColor.tooltip=Particle color and alpha at the end of its life, blended from the start color.
component.ParticleEmitter.texturePath=Texture Path
component.ParticleEmitter.texturePath.tooltip=Texture or atlas used for particles. Empty draws a soft round dot.
component.ParticleEmitter.atlasColumns=Atlas Columns
component.ParticleEmitter.atlasColumns.tooltip=Number of frame columns in the texture atlas.
component.ParticleEmitter.atlasRows=Atlas Rows
component.ParticleEmitter.atlasRows.tooltip=Number of frame rows in the texture atlas.
component.ParticleEmitter.animateFrames=Animate Frames
component.ParticleEmitter.animateFrames.tooltip=Plays the atlas frames in order over each particle's life instead of showing the first frame.
component.ParticleEmitter.additive=Additive Blending
component.ParticleEmitter.additive.tooltip=Adds particle colors for glowing effects like fire or sparks. Off uses alpha blending for smoke.
component.ParticleEmitter.seed=Seed
component.ParticleEmitter.seed.tooltip=Random seed for repeatable effects. 0 picks a new random seed each start.
component.ParticleEmitter.liveCount=Live particles: %d
component.ParticleEmitter.liveCount.tooltip=Read-only: number of particles currently alive for this emitter.
component.ParticleEmitter.restart=Restart
component.ParticleEmitter.restart.tooltip=Clears the emitter and starts emitting again from the beginning.
component.ParticleEmitter.stop=Stop
component.ParticleEmitter.stop.tooltip=Stops emitting new particles; live ones finish their lives.

# Follow camera (GPL-05)
component.FollowCameraComponent.targetName=Target
component.FollowCameraComponent.targetName.tooltip=Name of the GameObject the camera follows and orbits around.
component.FollowCameraComponent.distance=Distance (m)
component.FollowCameraComponent.distance.tooltip=Distance in metres from the pivot to the camera when nothing blocks the arm.
component.FollowCameraComponent.pivotHeight=Pivot Height (m)
component.FollowCameraComponent.pivotHeight.tooltip=Height in metres above the target origin of the point the camera looks at and orbits.
component.FollowCameraComponent.pitch=Pitch (deg)
component.FollowCameraComponent.pitch.tooltip=Starting vertical angle of the camera around the pivot, in degrees. Positive values look down.
component.FollowCameraComponent.minPitch=Min Pitch (deg)
component.FollowCameraComponent.minPitch.tooltip=Lowest orbit angle in degrees. Negative values look up at the target from below.
component.FollowCameraComponent.maxPitch=Max Pitch (deg)
component.FollowCameraComponent.maxPitch.tooltip=Highest orbit angle in degrees. Positive values look down on the target.
component.FollowCameraComponent.usePlayerPresets=Use Player Presets
component.FollowCameraComponent.usePlayerPresets.tooltip=Blends distance and height to the preset given by the player, such as walking or riding.
component.FollowCameraComponent.presetSharpness=Preset Blend Speed
component.FollowCameraComponent.presetSharpness.tooltip=How fast distance and height blend to a new player preset, such as walking or riding.
component.FollowCameraComponent.followSharpness=Follow Speed
component.FollowCameraComponent.followSharpness.tooltip=How tightly the camera trails the target. Higher values follow more closely, lower values lag behind.
component.FollowCameraComponent.orbitSensitivity=Orbit Sensitivity
component.FollowCameraComponent.orbitSensitivity.tooltip=Degrees of orbit per unit of look input. Higher values turn the camera faster.
component.FollowCameraComponent.autoAlign=Auto Align Behind
component.FollowCameraComponent.autoAlign.tooltip=Swings the camera back behind the target once the player stops using the look input and the target moves.
component.FollowCameraComponent.autoAlignDelay=Auto Align Delay (s)
component.FollowCameraComponent.autoAlignDelay.tooltip=Seconds without look input before the camera starts swinging back behind the target.
component.FollowCameraComponent.autoAlignSharpness=Auto Align Speed
component.FollowCameraComponent.autoAlignSharpness.tooltip=How fast the camera swings back behind the target. Higher values recenter faster.
component.FollowCameraComponent.autoAlignMinSpeed=Auto Align Min Speed (m/s)
component.FollowCameraComponent.autoAlignMinSpeed.tooltip=Target speed in m/s below which the camera does not swing back behind it.
component.FollowCameraComponent.collision=Spring Arm Collision
component.FollowCameraComponent.collision.tooltip=Shortens the camera arm when a wall or object is between the target and the camera.
component.FollowCameraComponent.probeRadius=Probe Radius (m)
component.FollowCameraComponent.probeRadius.tooltip=Radius in metres of the sphere swept from the pivot to detect obstacles for the arm.
component.FollowCameraComponent.minDistance=Min Distance (m)
component.FollowCameraComponent.minDistance.tooltip=Shortest the camera arm can get, in metres, when an obstacle pushes the camera in.
component.FollowCameraComponent.returnSharpness=Arm Return Speed
component.FollowCameraComponent.returnSharpness.tooltip=How fast the arm eases back to full length once an obstacle is cleared.
component.FollowCameraComponent.shakeDecay=Shake Decay (/s)
component.FollowCameraComponent.shakeDecay.tooltip=Shake trauma lost per second. Higher values make shakes die out faster.
component.FollowCameraComponent.shakeMaxOffset=Shake Max Offset (m)
component.FollowCameraComponent.shakeMaxOffset.tooltip=Largest position offset in metres a shake applies at full trauma.
component.FollowCameraComponent.shakeMaxRoll=Shake Max Roll (deg)
component.FollowCameraComponent.shakeMaxRoll.tooltip=Largest roll in degrees a shake applies at full trauma.
component.FollowCameraComponent.shakeFrequency=Shake Frequency
component.FollowCameraComponent.shakeFrequency.tooltip=How fast the camera oscillates during a shake. Higher values give a faster, jittery shake.
component.FollowCameraComponent.impactShakeImpulse=Impact Shake Threshold
component.FollowCameraComponent.impactShakeImpulse.tooltip=Minimum collision impulse on the target that triggers an impact shake. Higher = only hard hits.
component.FollowCameraComponent.impactShake=Impact Shake Amount
component.FollowCameraComponent.impactShake.tooltip=Shake trauma added when the target hits something hard enough, from 0 to 1.
component.FirstPersonCameraComponent.targetName=Target
component.FirstPersonCameraComponent.targetName.tooltip=Name of the GameObject whose eyes the camera looks through.
component.FirstPersonCameraComponent.eyeHeight=Eye Height (m)
component.FirstPersonCameraComponent.eyeHeight.tooltip=Height in metres of the camera above the target origin (its feet).
component.FirstPersonCameraComponent.forwardOffset=Forward Offset (m)
component.FirstPersonCameraComponent.forwardOffset.tooltip=Distance in metres the camera sits ahead of the target, so the head mesh does not block the view.
component.FirstPersonCameraComponent.pitch=Pitch (deg)
component.FirstPersonCameraComponent.pitch.tooltip=Downward tilt of the camera in degrees. Positive values look down.
component.FirstPersonCameraComponent.followSharpness=Follow Sharpness
component.FirstPersonCameraComponent.followSharpness.tooltip=How fast the camera catches up with the target's eyes and facing. Higher is tighter.
component.CameraCycleComponent.cameraNames=Cameras
component.CameraCycleComponent.cameraNames.tooltip=Camera objects to cycle through while the game runs, comma-separated, in order.
component.CameraCycleComponent.buttonName=Button
component.CameraCycleComponent.buttonName.tooltip=Runtime UI button that switches to the next camera. Leave empty for none.
component.CameraCycleComponent.actionId=Input Action
component.CameraCycleComponent.actionId.tooltip=Input action that switches to the next camera (default camera.cycle: C or gamepad Back). Leave empty for none.
