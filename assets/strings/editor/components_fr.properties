# Component Properties
component.AmbientLightComponent.lightColor=Couleur de la lumière
component.AmbientLightComponent.lightColor.tooltip=Couleur de la lumière ambiante appliquée uniformément à toutes les surfaces, quelle que soit leur orientation.
component.AmbientLightComponent.intensity=Intensité de la lumière
component.AmbientLightComponent.intensity.tooltip=Luminosité de la lumière ambiante uniforme qui éclaire les ombres. 0 = aucune, plus élevé éclaircit toute la scène.
component.DirectionalLightComponent.direction=Direction de la lumière
component.DirectionalLightComponent.direction.tooltip=Direction de propagation de la lumière, en vecteur du monde. (0, -1, 0) éclaire à la verticale.
component.DirectionalLightComponent.color=Couleur de la lumière
component.DirectionalLightComponent.color.tooltip=Couleur de la lumière solaire émise par cette lumière.
component.DirectionalLightComponent.intensity=Intensité de la lumière
component.DirectionalLightComponent.intensity.tooltip=Multiplicateur de luminosité. 0 = éteinte, 1 = normale, plus élevé = plus lumineuse.
component.DirectionalLightComponent.castShadows=Projeter des ombres
component.DirectionalLightComponent.castShadows.tooltip=Calcule une shadow map pour que les objets éclairés par cette lumière projettent des ombres.
component.DirectionalLightComponent.orthoNear=Ortho proche
component.DirectionalLightComponent.orthoNear.tooltip=Profondeur proche de la boîte de projection des ombres, en unités du monde. Utilisée sans calcul auto des limites.
component.DirectionalLightComponent.orthoFar=Ortho lointain
component.DirectionalLightComponent.orthoFar.tooltip=Profondeur lointaine de la boîte de projection des ombres, en unités du monde. Utilisée sans calcul auto des limites.
component.DirectionalLightComponent.orthoLeft=Ortho gauche
component.DirectionalLightComponent.orthoLeft.tooltip=Bord gauche de la boîte de projection des ombres, en unités du monde. Utilisé sans calcul auto des limites.
component.DirectionalLightComponent.orthoRight=Ortho droite
component.DirectionalLightComponent.orthoRight.tooltip=Bord droit de la boîte de projection des ombres, en unités du monde. Utilisé sans calcul auto des limites.
component.DirectionalLightComponent.orthoTop=Ortho haut
component.DirectionalLightComponent.orthoTop.tooltip=Bord supérieur de la boîte de projection des ombres, en unités du monde. Utilisé sans calcul auto des limites.
component.DirectionalLightComponent.orthoBottom=Ortho bas
component.DirectionalLightComponent.orthoBottom.tooltip=Bord inférieur de la boîte de projection des ombres, en unités du monde. Utilisé sans calcul auto des limites.
component.DirectionalLightComponent.shadowDistance=Distance des ombres
component.DirectionalLightComponent.shadowDistance.tooltip=Distance depuis la caméra, en mètres, jusqu'à laquelle les ombres sont rendues. Plus bas = ombres plus nettes.
component.DirectionalLightComponent.depthBias=Biais de profondeur
component.DirectionalLightComponent.depthBias.tooltip=Décalage de profondeur des ombres contre l'acné d'ombre. Trop élevé, les ombres se détachent des objets.
component.DirectionalLightComponent.slopeScaledBias=Biais proportionnel à la pente
component.DirectionalLightComponent.slopeScaledBias.tooltip=Décalage d'ombre supplémentaire sur les surfaces rasantes à la lumière. Augmentez-le si les pentes montrent de l'acné.
component.DirectionalLightComponent.autoCalculateBounds=Calcul auto des limites
component.DirectionalLightComponent.autoCalculateBounds.tooltip=Ajuste la zone d'ombre à la vue de la caméra jusqu'à la distance des ombres, au lieu des valeurs Ortho.
component.DirectionalLightComponent.stabilizeProjection=Stabiliser la projection
component.DirectionalLightComponent.stabilizeProjection.tooltip=Aligne la shadow map sur les texels pour que les bords des ombres ne scintillent pas quand la caméra bouge.
component.PointLightComponent.color=Couleur de la lumière
component.PointLightComponent.color.tooltip=Couleur RVB de la lumière émise par cette lumière ponctuelle.
component.PointLightComponent.intensity=Intensité de la lumière
component.PointLightComponent.intensity.tooltip=Multiplicateur de luminosité de la lumière. 0 = éteinte, plus élevé = plus lumineuse.
component.PointLightComponent.constant=Constante
component.PointLightComponent.constant.tooltip=Terme d'atténuation constant. Généralement 1 ; plus élevé, la lumière est plus faible partout.
component.PointLightComponent.linear=Linéaire
component.PointLightComponent.linear.tooltip=Terme d'atténuation linéaire. Plus élevé, la lumière décroît plus vite avec la distance.
component.PointLightComponent.quadratic=Quadratique
component.PointLightComponent.quadratic.tooltip=Terme d'atténuation quadratique. Plus élevé, la portée de la lumière diminue fortement.
component.SpotLightComponent.direction=Direction
component.SpotLightComponent.direction.tooltip=Direction du projecteur, sous forme de vecteur. Par défaut, vers le bas.
component.SpotLightComponent.constant=Constante
component.SpotLightComponent.constant.tooltip=Terme d'atténuation constant. Généralement 1 ; plus élevé, la lumière est plus faible partout.
component.SpotLightComponent.linear=Linéaire
component.SpotLightComponent.linear.tooltip=Terme d'atténuation linéaire. Plus élevé, la lumière décroît plus vite avec la distance.
component.SpotLightComponent.quadratic=Quadratique
component.SpotLightComponent.quadratic.tooltip=Terme d'atténuation quadratique. Plus élevé, la portée de la lumière diminue fortement.
component.SpotLightComponent.color=Couleur de la lumière
component.SpotLightComponent.color.tooltip=Couleur RVB de la lumière émise par ce projecteur.
component.SpotLightComponent.intensity=Intensité de la lumière
component.SpotLightComponent.intensity.tooltip=Multiplicateur de luminosité de la lumière. 0 = éteinte, plus élevé = plus lumineuse.
component.SpotLightComponent.cutOff=Angle de coupure
component.SpotLightComponent.cutOff.tooltip=Angle du cône intérieur en degrés ; la lumière y est à pleine intensité.
component.SpotLightComponent.outerCutOff=Angle de coupure externe
component.SpotLightComponent.outerCutOff.tooltip=Angle du cône extérieur en degrés ; la lumière s'estompe entre l'angle intérieur et celui-ci.
component.Transform.translation=Translation
component.Transform.translation.tooltip=Position relative à l'objet parent, en unités du monde.
component.Transform.rotation=Rotation
component.Transform.rotation.tooltip=Rotation locale en degrés autour de X (tangage), Y (lacet) et Z (roulis).
component.Transform.scale=Échelle
component.Transform.scale.tooltip=Facteur d'échelle local sur chaque axe. 1 = taille d'origine.
component.RigidBody3D.mass=Masse
component.RigidBody3D.mass.tooltip=Masse du corps en kilogrammes. Plus lourd, il est plus difficile à pousser. Ignorée pour les corps statiques.
component.RigidBody3D.bodyType=Type de corps
component.RigidBody3D.bodyType.tooltip=Statique ne bouge jamais, Dynamique suit la physique, Cinématique est déplacé par le code.
component.RigidBody3D.useCCD=Utiliser le CCD
component.RigidBody3D.useCCD.tooltip=Détection de collision continue : empêche les corps rapides de traverser les objets fins.
component.RigidBody3D.friction=Friction
component.RigidBody3D.friction.tooltip=Friction de surface contre les autres corps. 0 = glissant, plus élevé = meilleure adhérence.
component.RigidBody3D.linearDamping=Amortissement linéaire
component.RigidBody3D.linearDamping.tooltip=Ralentit le déplacement au fil du temps, comme la traînée. 0 = aucun, plus élevé = arrêt plus rapide.
component.RigidBody3D.angularDamping=Amortissement angulaire
component.RigidBody3D.angularDamping.tooltip=Ralentit la rotation au fil du temps. 0 = aucun amortissement, plus élevé = arrêt plus rapide.
component.RenderComponent.castShadow=Projeter une ombre
component.RenderComponent.castShadow.tooltip=Fait projeter des ombres par ce modèle sur les autres surfaces.
component.RenderComponent.receiveShadow=Recevoir les ombres
component.RenderComponent.receiveShadow.tooltip=Permet aux ombres des autres objets de s'afficher sur ce modèle.
component.RenderComponent.textureScale=Échelle de la texture
component.RenderComponent.textureScale.tooltip=Multiplicateur de répétition de la texture sur le modèle. Plus élevé, la texture se répète davantage.
component.RenderComponent.renderMode=Mode de rendu
component.RenderComponent.renderMode.tooltip=Ce qui est affiché : le maillage, les os du squelette, ou les deux.
component.SpriteRenderer.color=Couleur de base
component.SpriteRenderer.color.tooltip=Teinte et alpha multipliés avec la texture du sprite. Le blanc conserve les couleurs d'origine.
component.SpriteRenderer.zIndex=zIndex
component.SpriteRenderer.zIndex.tooltip=Ordre d'affichage 2D. Les sprites avec un zIndex plus élevé sont dessinés par-dessus.
component.SpriteRenderer.texture=Texture
component.SpriteRenderer.texture.tooltip=Image ou texture du sprite affichée par ce rendu, teintée par la couleur de base.
component.BoxCollider3D.halfExtents=Demi-dimensions
component.BoxCollider3D.halfExtents.tooltip=Moitié de la taille de la boîte sur chaque axe local, en unités du monde. 1 donne une boîte de 2 x 2 x 2.
component.BoxCollider3D.margin=Marge
component.BoxCollider3D.margin.tooltip=Marge de collision ajoutée autour de la forme, en unités du monde. De petites valeurs stabilisent les contacts.
component.BoxCollider3D.offset=Décalage
component.BoxCollider3D.offset.tooltip=Position du centre de la boîte par rapport au GameObject, en unités du monde.
component.CameraComponent.isOrthographic=Orthographique
component.CameraComponent.isOrthographic.tooltip=Utilise une projection orthographique sans perspective : les objets gardent leur taille à toute distance.
component.CameraComponent.fov=Champ de vision
component.CameraComponent.fov.tooltip=Champ de vision vertical en degrés. Plus élevé montre davantage de la scène, avec plus de déformation.
component.CameraComponent.nearPlane=Plan proche
component.CameraComponent.nearPlane.tooltip=Distance minimale rendue par la caméra, en mètres. Une valeur trop petite cause des artefacts de profondeur.
component.CameraComponent.farPlane=Plan lointain
component.CameraComponent.farPlane.tooltip=Distance maximale rendue par la caméra, en mètres. Les objets au-delà sont coupés.
component.CameraComponent.zoom=Zoom
component.CameraComponent.zoom.tooltip=Multiplie le champ de vision (ou la taille orthographique). Moins de 1 rapproche, plus de 1 éloigne.
component.CameraComponent.isDefault=Par défaut
component.CameraComponent.isDefault.tooltip=Fait de cette caméra celle utilisée quand la scène s'exécute. Sinon, la première caméra trouvée est utilisée.
component.DayNightCycleComponent.timeOfDay=Heure de la journée
component.DayNightCycleComponent.timeOfDay.tooltip=Heure actuelle du cycle, de 0 à 24. 12 correspond à midi ; elle fixe la position et la couleur du soleil.
component.DayNightCycleComponent.dayDuration=Durée du jour
component.DayNightCycleComponent.dayDuration.tooltip=Secondes réelles pour un cycle complet de 24 heures (60 à 600). Plus bas, les jours passent plus vite.
component.DayNightCycleComponent.shadowIntensity=Intensité des ombres
component.DayNightCycleComponent.shadowIntensity.tooltip=Force des ombres fixée par le cycle : 1 le jour, plus faible la nuit. 0 = aucune ombre.
component.DayNightCycleComponent.isDaytime=Jour
component.DayNightCycleComponent.isDaytime.tooltip=Lecture seule : indique si l'heure actuelle est comprise entre 6 h et 18 h.
component.DayNightCycleComponent.autoAmbient=Mode ambiant automatique
component.DayNightCycleComponent.autoAmbient.tooltip=Fait varier la lumière ambiante de la scène entre les couleurs ambiantes de nuit et de jour au fil du temps.
component.DayNightCycleComponent.timeScale=Échelle de temps
component.DayNightCycleComponent.timeScale.tooltip=Multiplicateur de vitesse du cycle. 1 = normal, 0 = en pause, plus élevé accélère le temps.
component.ScenePhysicsComponent.debugEnabled=Mode débogage
component.ScenePhysicsComponent.debugEnabled.tooltip=Affiche les collisionneurs et les formes de débogage physique dans la vue.
component.ScenePhysicsComponent.gravity=Gravité
component.ScenePhysicsComponent.gravity.tooltip=Accélération de la gravité de la scène en mètres par seconde au carré. Par défaut 0, -9.81, 0.
component.GridLines.majorStep=Pas majeur
component.GridLines.majorStep.tooltip=Espacement en mètres entre les lignes majeures de la grille.
component.GridLines.minorStep=Pas mineur
component.GridLines.minorStep.tooltip=Espacement entre les lignes mineures de la grille, en unités du monde (1 = un mètre).
component.GridLines.majorColor=Couleur majeure
component.GridLines.majorColor.tooltip=Couleur des lignes majeures de la grille, tracées à chaque pas majeur.
component.GridLines.minorColor=Couleur mineure
component.GridLines.minorColor.tooltip=Couleur des lignes fines de la grille tracées entre les lignes principales.
component.GridLines.minExtent=Étendue minimale
component.GridLines.minExtent.tooltip=Demi-taille minimale de la grille quand la caméra est proche, en unités du monde.
component.GridLines.maxExtent=Étendue maximale
component.GridLines.maxExtent.tooltip=Demi-taille maximale de la grille quand la caméra s'éloigne, en unités du monde.
component.GridLines.lodCloseDistance=Distance LOD proche
component.GridLines.lodCloseDistance.tooltip=Distance de la caméra en mètres jusqu'à laquelle les lignes mineures sont pleinement visibles avant de s'estomper.
component.GridLines.lodFarDistance=Distance LOD lointaine
component.GridLines.lodFarDistance.tooltip=Distance de la caméra en mètres à laquelle les lignes mineures ont complètement disparu.
component.GridLines.showGrid=Afficher la grille
component.GridLines.showGrid.tooltip=Affiche ou masque la grille de référence dans la vue de l'éditeur.
component.GridLines.showOriginAxes=Afficher les axes d'origine
component.GridLines.showOriginAxes.tooltip=Trace les axes X et Z colorés passant par l'origine du monde quand la caméra est proche.
component.GridLines.gridYOffset=Décalage Y de la grille
component.GridLines.gridYOffset.tooltip=Hauteur du plan de la grille en unités du monde. 0 la place à l'origine du monde.
component.GridLines.showCenterMarker=Afficher le marqueur central
component.GridLines.showCenterMarker.tooltip=Affiche un marqueur à l'origine du monde lorsque la caméra est assez proche.
component.GridLines.centerMarkerColor=Couleur du marqueur central
component.GridLines.centerMarkerColor.tooltip=Couleur du marqueur affiché au centre de la grille.
component.GridLines.centerMarkerDistance=Distance du marqueur central
component.GridLines.centerMarkerDistance.tooltip=Distance de la caméra en mètres en dessous de laquelle le marqueur central est affiché.
component.GridLines.edgeFadeEnabled=Fondu des bords activé
component.GridLines.edgeFadeEnabled.tooltip=Estompe les lignes de la grille vers le bord extérieur de la grille.
component.GridLines.edgeFadeStart=Début du fondu des bords
component.GridLines.edgeFadeStart.tooltip=Fraction de l'étendue de la grille où commence le fondu, de 0 à 1. Plus bas commence le fondu plus tôt.
component.GridLines.secondaryGridEnabled=Grille secondaire
component.GridLines.secondaryGridEnabled.tooltip=Affiche un second plan de grille à la hauteur définie par Position Y de la grille secondaire.
component.GridLines.secondaryGridY=Position Y de la grille secondaire
component.GridLines.secondaryGridY.tooltip=Hauteur du plan de la grille secondaire, en unités du monde.
component.GridLines.secondaryGridColor=Couleur de la grille secondaire
component.GridLines.secondaryGridColor.tooltip=Couleur des lignes de la grille secondaire optionnelle tracée à une autre hauteur.
component.GridLines.snapVisualizationEnabled=Aide visuelle au magnétisme
component.GridLines.snapVisualizationEnabled.tooltip=Affiche des marqueurs aux intersections de la grille principale sur lesquelles les objets s'aimantent.
component.GridLines.snapMarkerColor=Couleur du marqueur de magnétisme
component.GridLines.snapMarkerColor.tooltip=Couleur des marqueurs indiquant les points de magnétisme sur la grille principale.
component.GridLines.originAxesThickness=Épaisseur des axes d'origine
component.GridLines.originAxesThickness.tooltip=Épaisseur des axes X et Z colorés passant par l'origine du monde, en unités du monde.
component.EnvironmentComponent.skyColor=Couleur du ciel
component.EnvironmentComponent.skyColor.tooltip=Couleur de fond du ciel utilisée quand aucune texture de ciel n'est définie.
component.EnvironmentComponent.skyTint=Teinte du ciel
component.EnvironmentComponent.skyTint.tooltip=Couleur multipliée avec la texture du ciel. Le blanc la laisse inchangée.
component.EnvironmentComponent.skyExposure=Exposition du ciel
component.EnvironmentComponent.skyExposure.tooltip=Multiplicateur de luminosité de la texture du ciel. 1 = inchangée, plus élevé l'éclaircit.
component.EnvironmentComponent.skyRotation=Rotation du ciel
component.EnvironmentComponent.skyRotation.tooltip=Rotation de la texture du ciel autour de l'axe vertical, en degrés.
component.EnvironmentComponent.skyTexture=Texture du ciel
component.EnvironmentComponent.skyTexture.tooltip=Image panoramique (HDRI) affichée sur le dôme céleste. Vide utilise la couleur du ciel.
component.EnvironmentComponent.fogColor=Couleur du brouillard
component.EnvironmentComponent.fogColor.tooltip=Couleur vers laquelle les objets lointains s'estompent à mesure que le brouillard s'épaissit.
component.EnvironmentComponent.fogDensity=Densité du brouillard
component.EnvironmentComponent.fogDensity.tooltip=Densité du brouillard par mètre pour les modes exponentiels. 0 = aucun brouillard, plus élevé l'épaissit.
component.EnvironmentComponent.renderSky=Afficher le ciel
component.EnvironmentComponent.renderSky.tooltip=Affiche le ciel (texture ou couleur du ciel) derrière la scène. Désactivé laisse un fond uni.
component.EnvironmentComponent.renderFog=Afficher le brouillard
component.EnvironmentComponent.renderFog.tooltip=Applique le brouillard de distance à la scène. Désactivé, il n'y a pas de brouillard quelle que soit sa densité.
component.DayNightCycleComponent.noonColor=Couleur de midi
component.DayNightCycleComponent.noonColor.tooltip=Couleur du soleil au milieu de la journée, quand il est au plus haut.
component.DayNightCycleComponent.duskColor=Couleur du crépuscule
component.DayNightCycleComponent.duskColor.tooltip=Couleur du soleil vers le coucher (18 h), interpolée de celle de midi vers la couleur de nuit.
component.DayNightCycleComponent.nightColor=Couleur de nuit
component.DayNightCycleComponent.nightColor.tooltip=Couleur de la lumière la nuit, utilisée comme clair de lune entre le crépuscule et l'aube.
component.DayNightCycleComponent.dawnColor=Couleur de l'aube
component.DayNightCycleComponent.dawnColor.tooltip=Couleur du soleil vers le lever du jour (6 h), interpolée de la couleur de nuit vers celle de midi.
component.DayNightCycleComponent.dayAmbient=Couleur ambiante de jour
component.DayNightCycleComponent.dayAmbient.tooltip=Couleur de la lumière ambiante en plein jour quand le mode ambiant automatique est activé.
component.DayNightCycleComponent.nightAmbient=Couleur ambiante de nuit
component.DayNightCycleComponent.nightAmbient.tooltip=Couleur de la lumière ambiante la nuit quand le mode ambiant automatique est activé.

# UI authoring (GUI-03)
component.JointComponent.jointType=Type de joint
component.JointComponent.jointType.tooltip=Type de contrainte : fixe, charnière, cône-torsion, glissière ou six degrés de liberté.
component.JointComponent.connectedBody=Corps connecté
component.JointComponent.connectedBody.tooltip=Corps rigide auquel ce joint est rattaché. Monde le fixe à un point immobile de la scène.
component.JointComponent.worldAnchor=Monde (ancre statique)
component.JointComponent.worldAnchor.tooltip=Aucun corps connecté : le joint retient cet objet à un point fixe du monde.
component.JointComponent.anchor=Ancre
component.JointComponent.anchor.tooltip=Point pivot du joint dans l'espace local de ce corps, en unités du monde.
component.JointComponent.connectedAnchor=Ancre connectée
component.JointComponent.connectedAnchor.tooltip=Point pivot du joint dans l'espace local du corps connecté, en unités du monde.
component.JointComponent.axis=Axe
component.JointComponent.axis.tooltip=Axe de rotation de la charnière ou direction de glissement, dans l'espace local de ce corps.
component.JointComponent.connectedAxis=Axe connecté
component.JointComponent.connectedAxis.tooltip=Axe de charnière ou de glissement correspondant dans l'espace local du corps connecté.
component.JointComponent.limitMin=Limite min
component.JointComponent.limitMin.tooltip=Limite inférieure : angle de la charnière en radians, ou course de la glissière en unités du monde.
component.JointComponent.limitMax=Limite max
component.JointComponent.limitMax.tooltip=Limite supérieure : angle de la charnière en radians, ou course de la glissière en unités du monde.
component.JointComponent.swingSpan1=Ouverture 1
component.JointComponent.swingSpan1.tooltip=Angle d'oscillation maximal autour du premier axe du cône, en radians.
component.JointComponent.swingSpan2=Ouverture 2
component.JointComponent.swingSpan2.tooltip=Angle d'oscillation maximal autour du second axe du cône, en radians.
component.JointComponent.twistSpan=Torsion
component.JointComponent.twistSpan.tooltip=Angle de torsion maximal autour de l'axe principal du joint, en radians.
component.JointComponent.linearLower=Linéaire min
component.JointComponent.linearLower.tooltip=Limite de translation inférieure par axe (X, Y, Z), en unités du monde. Égale au max, elle bloque l'axe.
component.JointComponent.linearUpper=Linéaire max
component.JointComponent.linearUpper.tooltip=Limite de translation supérieure par axe (X, Y, Z), en unités du monde.
component.JointComponent.angularLower=Angulaire min
component.JointComponent.angularLower.tooltip=Limite de rotation inférieure par axe (X, Y, Z), en radians. Min supérieur au max laisse l'axe libre.
component.JointComponent.angularUpper=Angulaire max
component.JointComponent.angularUpper.tooltip=Limite de rotation supérieure par axe (X, Y, Z), en radians.
component.ReverbZone.preset=Préréglage
component.ReverbZone.preset.tooltip=Type de réverbération appliqué dans la zone, par exemple pièce ou salle.
component.ReverbZone.radius=Rayon
component.ReverbZone.radius.tooltip=Rayon de la zone sphérique autour de l'objet, en unités du monde.
component.ReverbZone.priority=Priorité
component.ReverbZone.priority.tooltip=Quand des zones se chevauchent, la priorité la plus haute l'emporte, puis le centre le plus proche.
component.ReverbZone.sendLevel=Niveau d'envoi
component.ReverbZone.sendLevel.tooltip=Quantité de réverbération appliquée quand l'auditeur est dans la zone. 0 = aucune, 1 = totale.
component.ReverbZone.lowPassGainHF=Gain HF passe-bas
component.ReverbZone.lowPassGainHF.tooltip=Gain des hautes fréquences dans la zone. 1 = aucun filtrage, plus bas = son plus étouffé.
component.ParticleEmitter.playOnStart=Jouer au démarrage
component.ParticleEmitter.playOnStart.tooltip=Démarre l'émission automatiquement quand la scène se lance.
component.ParticleEmitter.looping=En boucle
component.ParticleEmitter.looping.tooltip=Relance l'émission après chaque cycle. Désactivé, l'émetteur ne fait qu'un seul cycle.
component.ParticleEmitter.duration=Durée (s)
component.ParticleEmitter.duration.tooltip=Durée d'un cycle d'émission, en secondes. Un émetteur en boucle recommence ensuite.
component.ParticleEmitter.maxParticles=Particules max
component.ParticleEmitter.maxParticles.tooltip=Nombre maximal de particules actives simultanément. Au-delà, aucune nouvelle n'est émise.
component.ParticleEmitter.emissionRate=Taux d'émission (/s)
component.ParticleEmitter.emissionRate.tooltip=Nombre de particules émises par seconde pendant la lecture.
component.ParticleEmitter.burstCount=Rafale
component.ParticleEmitter.burstCount.tooltip=Nombre de particules émises d'un coup au démarrage de l'émetteur. 0 = pas de rafale.
component.ParticleEmitter.shape=Forme
component.ParticleEmitter.shape.tooltip=Zone d'apparition et direction initiale des particules : point, sphère, boîte ou cône.
component.ParticleEmitter.shapeRadius=Rayon de la forme
component.ParticleEmitter.shapeRadius.tooltip=Rayon de la sphère ou de la base du cône d'émission, en unités du monde.
component.ParticleEmitter.coneAngle=Angle du cône
component.ParticleEmitter.coneAngle.tooltip=Ouverture du cône autour de +Y, en degrés. 0 = droit vers le haut.
component.ParticleEmitter.boxSize=Taille de la boîte
component.ParticleEmitter.boxSize.tooltip=Taille de la boîte dans laquelle les particules apparaissent, en unités du monde.
component.ParticleEmitter.lifetimeMin=Durée de vie min
component.ParticleEmitter.lifetimeMin.tooltip=Durée de vie la plus courte d'une particule, en secondes.
component.ParticleEmitter.lifetimeMax=Durée de vie max
component.ParticleEmitter.lifetimeMax.tooltip=Durée de vie la plus longue d'une particule, en secondes.
component.ParticleEmitter.speedMin=Vitesse min
component.ParticleEmitter.speedMin.tooltip=Vitesse initiale minimale des particules, en unités du monde par seconde.
component.ParticleEmitter.speedMax=Vitesse max
component.ParticleEmitter.speedMax.tooltip=Vitesse initiale maximale des particules, en unités du monde par seconde.
component.ParticleEmitter.endSpeedScale=Échelle de vitesse finale
component.ParticleEmitter.endSpeedScale.tooltip=Multiplicateur de vitesse atteint en fin de vie. 1 = vitesse constante, 0 = arrêt progressif.
component.ParticleEmitter.gravity=Gravité
component.ParticleEmitter.gravity.tooltip=Accélération dans l'espace du monde appliquée à chaque particule, en unités par seconde au carré.
component.ParticleEmitter.startSize=Taille initiale
component.ParticleEmitter.startSize.tooltip=Taille de la particule à son apparition, en unités du monde.
component.ParticleEmitter.endSize=Taille finale
component.ParticleEmitter.endSize.tooltip=Taille de la particule en fin de vie, en unités du monde.
component.ParticleEmitter.startColor=Couleur initiale
component.ParticleEmitter.startColor.tooltip=Couleur et alpha de la particule à son apparition.
component.ParticleEmitter.endColor=Couleur finale
component.ParticleEmitter.endColor.tooltip=Couleur et alpha de la particule en fin de vie, interpolées depuis la couleur initiale.
component.ParticleEmitter.texturePath=Chemin de la texture
component.ParticleEmitter.texturePath.tooltip=Texture ou atlas utilisé pour les particules. Vide : un point rond et doux est affiché.
component.ParticleEmitter.atlasColumns=Colonnes de l'atlas
component.ParticleEmitter.atlasColumns.tooltip=Nombre de colonnes d'images dans l'atlas de texture.
component.ParticleEmitter.atlasRows=Lignes de l'atlas
component.ParticleEmitter.atlasRows.tooltip=Nombre de lignes d'images dans l'atlas de texture.
component.ParticleEmitter.animateFrames=Animer les images
component.ParticleEmitter.animateFrames.tooltip=Fait défiler les images de l'atlas pendant la vie de chaque particule au lieu de la première image.
component.ParticleEmitter.additive=Mélange additif
component.ParticleEmitter.additive.tooltip=Additionne les couleurs pour les effets lumineux (feu, étincelles). Désactivé : mélange alpha (fumée).
component.ParticleEmitter.seed=Graine
component.ParticleEmitter.seed.tooltip=Graine aléatoire pour des effets reproductibles. 0 en choisit une nouvelle à chaque démarrage.
component.ParticleEmitter.liveCount=Particules actives : %d
component.ParticleEmitter.liveCount.tooltip=Lecture seule : nombre de particules actuellement actives pour cet émetteur.
component.ParticleEmitter.restart=Redémarrer
component.ParticleEmitter.restart.tooltip=Réinitialise l'émetteur et relance l'émission depuis le début.
component.ParticleEmitter.stop=Arrêter
component.ParticleEmitter.stop.tooltip=Arrête l'émission ; les particules actives terminent leur vie.

# Follow camera (GPL-05)
component.FollowCameraComponent.targetName=Cible
component.FollowCameraComponent.targetName.tooltip=Nom du GameObject que la caméra suit et autour duquel elle tourne.
component.FollowCameraComponent.distance=Distance (m)
component.FollowCameraComponent.distance.tooltip=Distance en mètres entre le pivot et la caméra quand rien ne bloque le bras.
component.FollowCameraComponent.pivotHeight=Hauteur du pivot (m)
component.FollowCameraComponent.pivotHeight.tooltip=Hauteur en mètres, au-dessus de l'origine de la cible, du point que la caméra vise et autour duquel elle tourne.
component.FollowCameraComponent.pitch=Inclinaison (deg)
component.FollowCameraComponent.pitch.tooltip=Angle vertical initial de la caméra autour du pivot, en degrés. Les valeurs positives regardent vers le bas.
component.FollowCameraComponent.minPitch=Inclinaison min (deg)
component.FollowCameraComponent.minPitch.tooltip=Angle d'orbite minimal en degrés. Les valeurs négatives regardent la cible d'en bas.
component.FollowCameraComponent.maxPitch=Inclinaison max (deg)
component.FollowCameraComponent.maxPitch.tooltip=Angle d'orbite maximal en degrés. Les valeurs positives regardent la cible d'en haut.
component.FollowCameraComponent.usePlayerPresets=Utiliser les cadrages du joueur
component.FollowCameraComponent.usePlayerPresets.tooltip=Adapte la distance et la hauteur au cadrage fourni par le joueur, par exemple marche ou glisse.
component.FollowCameraComponent.presetSharpness=Vitesse de transition du cadrage
component.FollowCameraComponent.presetSharpness.tooltip=Rapidité de transition de la distance et de la hauteur vers un nouveau cadrage du joueur (marche, glisse).
component.FollowCameraComponent.followSharpness=Vitesse de suivi
component.FollowCameraComponent.followSharpness.tooltip=Fermeté avec laquelle la caméra suit la cible. Plus élevé suit de plus près, plus bas laisse du retard.
component.FollowCameraComponent.orbitSensitivity=Sensibilité d'orbite
component.FollowCameraComponent.orbitSensitivity.tooltip=Degrés d'orbite par unité de contrôle de la vue. Plus élevé fait tourner la caméra plus vite.
component.FollowCameraComponent.autoAlign=Recentrer derrière
component.FollowCameraComponent.autoAlign.tooltip=Ramène la caméra derrière la cible quand le joueur cesse d'orienter la vue et que la cible se déplace.
component.FollowCameraComponent.autoAlignDelay=Délai de recentrage (s)
component.FollowCameraComponent.autoAlignDelay.tooltip=Secondes sans contrôle de la vue avant que la caméra ne revienne derrière la cible.
component.FollowCameraComponent.autoAlignSharpness=Vitesse de recentrage
component.FollowCameraComponent.autoAlignSharpness.tooltip=Rapidité avec laquelle la caméra revient derrière la cible. Plus élevé recentre plus vite.
component.FollowCameraComponent.autoAlignMinSpeed=Vitesse min de recentrage (m/s)
component.FollowCameraComponent.autoAlignMinSpeed.tooltip=Vitesse de la cible en m/s en dessous de laquelle la caméra ne revient pas derrière elle.
component.FollowCameraComponent.collision=Collision du bras
component.FollowCameraComponent.collision.tooltip=Raccourcit le bras de la caméra quand un mur ou un objet se trouve entre la cible et la caméra.
component.FollowCameraComponent.probeRadius=Rayon de la sonde (m)
component.FollowCameraComponent.probeRadius.tooltip=Rayon en mètres de la sphère lancée depuis le pivot pour détecter les obstacles du bras.
component.FollowCameraComponent.minDistance=Distance min (m)
component.FollowCameraComponent.minDistance.tooltip=Longueur minimale du bras de la caméra, en mètres, quand un obstacle rapproche la caméra.
component.FollowCameraComponent.returnSharpness=Vitesse de retour du bras
component.FollowCameraComponent.returnSharpness.tooltip=Rapidité avec laquelle le bras revient à sa longueur complète une fois l'obstacle dégagé.
component.FollowCameraComponent.shakeDecay=Amortissement des secousses (/s)
component.FollowCameraComponent.shakeDecay.tooltip=Intensité de secousse perdue par seconde. Plus élevé fait s'arrêter les secousses plus vite.
component.FollowCameraComponent.shakeMaxOffset=Décalage max des secousses (m)
component.FollowCameraComponent.shakeMaxOffset.tooltip=Décalage de position maximal en mètres appliqué par une secousse à pleine intensité.
component.FollowCameraComponent.shakeMaxRoll=Roulis max des secousses (deg)
component.FollowCameraComponent.shakeMaxRoll.tooltip=Roulis maximal en degrés appliqué par une secousse à pleine intensité.
component.FollowCameraComponent.shakeFrequency=Fréquence des secousses
component.FollowCameraComponent.shakeFrequency.tooltip=Vitesse d'oscillation de la caméra pendant une secousse. Plus élevé donne une secousse plus rapide et nerveuse.
component.FollowCameraComponent.impactShakeImpulse=Seuil d'impact pour secouer
component.FollowCameraComponent.impactShakeImpulse.tooltip=Impulsion de collision minimale sur la cible qui déclenche une secousse. Plus élevé = seulement les chocs forts.
component.FollowCameraComponent.impactShake=Intensité des secousses d'impact
component.FollowCameraComponent.impactShake.tooltip=Intensité de secousse ajoutée quand la cible subit un choc assez fort, de 0 à 1.
