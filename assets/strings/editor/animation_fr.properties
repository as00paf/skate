# Éditeur d'animation (ANI-14)
window.animation_editor=Éditeur d'animation
help.animation_editor.what=Modifie un clip d'animation (.skanim) : le parcourir et le lire sur un personnage, déplacer, mettre à l'échelle, copier et supprimer des clés, poser des clés sur des os, ajouter des événements et changer sa durée ou sa cadence.
help.animation_editor.how=Choisissez un clip dans la liste Clip ou ouvrez-en un (un clip FBX ou glTF s'ouvre en copie .skanim modifiable). Cliquez sur la règle pour vous déplacer. Cliquez sur des clés pour les sélectionner (Ctrl ajoute), tracez un cadre pour en sélectionner plusieurs, faites glisser les clés sélectionnées pour les déplacer. Sélectionnez un os dans la liste ou l'aperçu, puis Clés sur os (K) enregistre sa pose à la tête de lecture. Tout se défait ; Enregistrer écrit le fichier.
