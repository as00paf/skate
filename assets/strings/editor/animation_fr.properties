# Video to Animation (ANI-17)
window.video_to_animation=Vidéo vers animation
help.video_to_animation.what=Transforme une vidéo d'une personne, stockée sur votre ordinateur, en clip d'animation pour votre personnage, ou importe un fichier de mocap (BVH, FBX, glTF) créé par un autre outil.
help.video_to_animation.how=Choisissez une vidéo et lisez-la. Pour n'en garder qu'une partie, placez-vous sur la première image voulue et cliquez sur Définir le début (I), puis sur la dernière et cliquez sur Définir la fin (O). Cliquez ensuite sur Créer l'animation. Le clip est enregistré dans Assets/Animations et affiché dans la fenêtre Projet. La première fois, ouvrez Configuration et indiquez un Python où MediaPipe est installé (voir docs/mocap-setup.md).
