# EDT-60: Version Control window (local Git repository, phase 1)
window.version_control=Version Control
menu.view.windows.project=Project
help.version_control.what=Version Control keeps the history of your project with Git, so you can see what changed, go back to an earlier version and try ideas on a branch. Git does not need to be installed.
help.version_control.how=Pick the files to keep in the Changes tab, write a message and press Commit. History lists earlier commits; click a file to see what changed. The branch menu switches branches; New branch starts one from the current commit.
help.version_control.related=The Project window lists the files; the Shell can run git for anything this window does not do.

