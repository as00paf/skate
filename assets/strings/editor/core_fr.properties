help.command_history.what=L'historique des commandes liste, dans l'ordre, les modifications faites dans la scène. Chacune peut être annulée.
help.command_history.how=Cliquez sur une commande, ou faites un clic droit et choisissez Annuler jusqu'ici, pour revenir à ce point. Les commandes annulées restent en dessous jusqu'à votre prochaine modification.
help.command_history.related=Les fenêtres Hiérarchie et Propriétés font les modifications listées ici.
help.shell.what=Le Shell exécute une commande à la fois, comme une tâche Gradle ou la CLI Skate, et affiche sa sortie en direct.
help.shell.how=Tapez une commande ou choisissez-en une dans Préréglages, puis appuyez sur Entrée ou Exécuter. Haut et Bas rappellent les commandes précédentes ; Annuler arrête celle en cours.
