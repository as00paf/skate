help.console.what=La Console liste les messages écrits par le moteur et l'éditeur : informations, avertissements, erreurs et vos actions.
help.console.how=Cherchez ou filtrez par niveau en haut. Cliquez sur une ligne pour la sélectionner (Ctrl et Maj en sélectionnent plusieurs), puis copiez-la avec Ctrl+C ou le menu du clic droit.
help.console.related=Le Shell exécute des commandes ; le Profileur montre les performances.
help.profiler.what=Le Profileur montre la vitesse de l'éditeur : temps par image, FPS, appels de dessin, temps de physique, mémoire et CPU par thread.
help.profiler.how=Figer arrête les graphiques pour les lire ; Réinitialiser les vide.
