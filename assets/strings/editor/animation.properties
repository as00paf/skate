# Animation editor (ANI-14)
window.animation_editor=Animation Editor
help.animation_editor.what=Edits an animation clip (.skanim): scrub and play it on a character, move, scale, copy and delete keys, key bones, add events and change its length or frame rate.
help.animation_editor.how=Pick a clip in the Clip list or open one (an FBX or glTF clip opens as an editable .skanim copy). Click the ruler to scrub. Click keys to select them (Ctrl adds), drag a box to select several, drag selected keys to move them. Select a bone in the list or in the preview, then Key bones (K) keys its pose at the playhead. Every change can be undone; Save writes the file.
lbl.animation_editor.no_clip=No clip open. Choose a clip above, or open an animation file.
