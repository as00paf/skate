lbl.animation_editor.no_project_clips=No .skanim clips in this project yet.
btn.animation_editor.open=Open...
btn.animation_editor.open.tooltip=Open an animation file. FBX, glTF and DAE clips stay untouched: an editable .skanim copy is made next to them.
btn.animation_editor.save=Save
btn.animation_editor.save.tooltip=Write the clip to its .skanim file.
btn.animation_editor.to_start=To start
btn.animation_editor.to_start.tooltip=Go to the first frame (Home).
