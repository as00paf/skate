window.video_to_animation=Video to Animation
help.video_to_animation.what=Turns a video of a person on your computer into an animation clip for your character, or imports a mocap file (BVH, FBX, glTF) made by another tool.
help.video_to_animation.how=Choose a video and play it. To keep only part of it, move to the first frame you want and click Set start (I), then to the last one and click Set end (O). Then click Create animation. The clip is saved in Assets/Animations and shown in the Project window. The first time, open Setup and point it to a Python with MediaPipe installed (see docs/mocap-setup.md).
