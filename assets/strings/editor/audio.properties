tooltip.audio.bus.volume=Bus volume (0-1). Saved with the project.
tooltip.audio.bus.low_pass=High-frequency gain of the bus: 1 = off, lower = duller. Applies to the bus and its children.
tooltip.audio.bus.reverb_send=How much of this bus is sent to the active reverb zone (0-1).

# Audio source inspector (EDT-14)
btn.audio.add_component=Add Audio Source
btn.audio.add_component.tooltip=Adds an Audio Source component to the selected GameObject. Can be undone.
btn.audio.remove_component=Remove Audio Source
btn.audio.remove_component.tooltip=Removes the Audio Source component from the selected GameObject. Can be undone.
btn.audio.play=Play
btn.audio.play.tooltip=Previews the sound in edit mode. The preview is not saved with the scene.
btn.audio.stop=Stop
btn.audio.stop.tooltip=Stops the sound preview that is currently playing.
component.AudioComponent.soundFilePath=Sound file
component.AudioComponent.soundFilePath.tooltip=Sound to play (WAV, OGG or MP3). Drop a sound from the asset browser here.
component.AudioComponent.clips=Random clips
component.AudioComponent.clips.tooltip=When not empty, a random clip (never the same twice in a row) plays instead of the sound file.
component.AudioComponent.clips.drop=Drop sounds here
component.AudioComponent.clips.drop.tooltip=Drag sounds from the asset browser onto this area to add them to the clip list.
component.AudioComponent.bus=Bus
component.AudioComponent.bus.tooltip=Mixer bus this sound is routed to; the bus volume and mute apply to it.
component.AudioComponent.volume=Volume
component.AudioComponent.volume.tooltip=Playback volume of this sound, before bus volumes. 0 = silent, 1 = full volume.
component.AudioComponent.loops=Loop
component.AudioComponent.loops.tooltip=Restarts the sound from the beginning each time it ends.
component.AudioComponent.playOnAwake=Play on awake
component.AudioComponent.playOnAwake.tooltip=Starts playing when the scene starts (Play). Turn off for sounds a script triggers.
component.AudioComponent.streamMode=Streaming
component.AudioComponent.streamMode.tooltip=AUTO streams Music bus sounds and files over 1 MB from disk; ALWAYS or NEVER force it.
component.AudioComponent.priority=Priority
component.AudioComponent.priority.tooltip=0 to 255. When all voices are in use, the sound with the higher priority keeps playing.
component.AudioComponent.is3D=3D (positional)
component.AudioComponent.is3D.tooltip=Positional sound, attenuated with distance and panned. Off = same volume everywhere.
component.AudioComponent.attenuationModel=Attenuation
component.AudioComponent.attenuationModel.tooltip=Curve used to lower the volume between the min and max distance. NONE keeps the same volume at any distance.
component.AudioComponent.minDistance=Min distance
component.AudioComponent.minDistance.tooltip=Distance in metres within which the sound plays at full volume.
component.AudioComponent.maxDistance=Max distance
component.AudioComponent.maxDistance.tooltip=Distance in metres beyond which the volume stops decreasing.
component.AudioComponent.rolloff=Rolloff
component.AudioComponent.rolloff.tooltip=How fast the volume falls off with distance. 0 = no falloff, higher = drops faster.
component.AudioComponent.dopplerFactor=Doppler
component.AudioComponent.dopplerFactor.tooltip=Pitch shift from the speed of physics bodies. 0 = off, higher = stronger. Never applied on the Music bus.
component.AudioComponent.dopplerFactor.music=Music bus: Doppler is ignored.
tooltip.audio.component.soundFilePath=Sound to play (WAV, OGG or MP3). Drop a sound from the asset browser here.
tooltip.audio.component.clips=When not empty, a random clip (never the same twice in a row) plays instead of the sound file.
tooltip.audio.component.bus=Mixer bus: its volume and mute apply to this sound.
tooltip.audio.component.loops=Restart the sound when it ends.
tooltip.audio.component.playOnAwake=Start playing when the scene starts (Play). Turn off for sounds a script triggers.
tooltip.audio.component.streamMode=AUTO streams OGG/MP3 music and files over 1 MB; ALWAYS or NEVER force it.
tooltip.audio.component.priority=0-255. Higher wins when all voices are in use.
tooltip.audio.component.is3D=Positional: attenuated with distance and panned. Off = plays at the same volume everywhere.
tooltip.audio.component.attenuationModel=How the volume falls off between min and max distance.
tooltip.audio.component.minDistance=Full volume closer than this (metres).
tooltip.audio.component.maxDistance=Distance where attenuation stops (metres).
tooltip.audio.component.rolloff=How fast the volume falls off with distance.
tooltip.audio.component.dopplerFactor=Pitch shift from the speed of physics bodies (0 = off). Never applied on the Music bus.
