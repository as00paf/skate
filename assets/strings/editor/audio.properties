tooltip.audio.component.soundFilePath=Sound to play (WAV, OGG or MP3). Drop a sound from the asset browser here.
tooltip.audio.component.clips=When not empty, a random clip (never the same twice in a row) plays instead of the sound file.
tooltip.audio.component.bus=Mixer bus: its volume and mute apply to this sound.
tooltip.audio.component.loops=Restart the sound when it ends.
tooltip.audio.component.playOnAwake=Start playing when the scene starts (Play). Turn off for sounds a script triggers.
tooltip.audio.component.streamMode=AUTO streams OGG/MP3 music and files over 1 MB; ALWAYS or NEVER force it.
tooltip.audio.component.priority=0-255. Higher wins when all voices are in use.
tooltip.audio.component.is3D=Positional: attenuated with distance and panned. Off = plays at the same volume everywhere.
tooltip.audio.component.attenuationModel=How the volume falls off between min and max distance.
tooltip.audio.component.minDistance=Full volume closer than this (metres).
tooltip.audio.component.maxDistance=Distance where attenuation stops (metres).
tooltip.audio.component.rolloff=How fast the volume falls off with distance.
tooltip.audio.component.dopplerFactor=Pitch shift from the speed of physics bodies (0 = off). Never applied on the Music bus.
