# Fenêtre Graphe de rendu (EDT-54)
help.render_graph.what=Les passes de rendu qui dessinent chaque image, dans leur ordre d'exécution, avec les ressources qu'elles lisent et écrivent et leur durée sur le GPU et le CPU.
help.render_graph.how=Cliquez sur une passe pour voir ses détails et l'historique de ses temps. La case d'une passe la désactive pour cette session (le cadenas marque les passes obligatoires). Dépliez Post-traitement pour activer ou désactiver chaque effet. Glissez avec le bouton du milieu ou le clic droit pour vous déplacer, utilisez la molette pour zoomer, et Ajuster pour cadrer le graphe.
help.render_graph.related=Le Profileur montre l'image entière ; les Paramètres de l'éditeur règlent la qualité graphique.
lbl.render_graph.fit=Ajuster
lbl.render_graph.fit.tooltip=Zoomer et déplacer la vue pour que tout le graphe tienne dans la fenêtre.
lbl.render_graph.actual_size=1:1
lbl.render_graph.actual_size.tooltip=Afficher le graphe à sa taille réelle.
lbl.render_graph.frame_cpu=CPU %s
lbl.render_graph.frame_gpu=GPU %s
tooltip.render_graph.frame_gpu=Somme des minuteurs GPU de chaque passe (il n'y a pas de minuteur pour l'image entière). Les temps GPU arrivent avec quelques images de retard.
lbl.render_graph.passes_enabled=%d/%d passes
lbl.render_graph.no_timers=Pas de minuteurs GPU
tooltip.render_graph.no_timers=Ce pilote graphique n'a pas de requêtes de minutage GPU : les barres et les totaux utilisent le temps CPU.
lbl.render_graph.timing=GPU %s  CPU %s
lbl.render_graph.off=Désactivée
lbl.render_graph.on_demand=À la demande
lbl.render_graph.last=dernier %s
lbl.render_graph.hint=Glissez avec le bouton du milieu ou le clic droit pour vous déplacer, molette pour zoomer, cliquez sur une passe pour ses détails.
lbl.render_graph.passes_off=Passes désactivées : %d
lbl.render_graph.enable_all=Tout activer
lbl.render_graph.enable_all.tooltip=Réactiver toutes les passes.
lbl.render_graph.picking_off=La sélection au clic dans la vue est désactivée
lbl.render_graph.no_passes.hint=Le moteur de rendu n'a pas encore créé ses passes. Ouvrez une scène pour lancer le rendu.
lbl.render_graph.history_gpu=Temps GPU, %d dernières images
lbl.render_graph.history_cpu=Temps CPU, %d dernières images
lbl.render_graph.avg_max=Moyenne %s, max %s
tooltip.render_graph.toggle=Activer ou désactiver cette passe pour cette session de l'éditeur. Les jeux exportés exécutent toujours toutes les passes.
tooltip.render_graph.toggle_picking=Activer ou désactiver la sélection pour cette session. Tant qu'elle est désactivée, cliquer dans la vue ne sélectionne pas d'objet.
tooltip.render_graph.required=Obligatoire : cette passe ne peut pas être désactivée.
tooltip.render_graph.on_demand=S'exécute seulement quand l'éditeur doit savoir ce qui est sous la souris : la plupart des images n'ont donc pas de temps. Le dernier temps mesuré est affiché.
tooltip.render_graph.expand=Afficher ou masquer les effets de cette passe.
tooltip.render_graph.stage=Activer ou désactiver cet effet.
tooltip.render_graph.stage_inactive=Cet effet ne peut pas s'exécuter ici : le post-traitement a besoin du framebuffer de la scène.
tooltip.render_graph.no_writer=%s : aucune passe précédente n'écrit cette ressource.
tooltip.render_graph.resource=%s : cliquez pour mettre ses liens en évidence.
tooltip.render_graph.close_details=Fermer le panneau de détails.
