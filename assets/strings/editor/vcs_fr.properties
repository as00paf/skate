# EDT-60 : fenêtre Gestion de versions (dépôt Git local, phase 1)
window.version_control=Gestion de versions
menu.view.windows.project=Projet
help.version_control.what=La gestion de versions garde l'historique de votre projet avec Git : vous voyez ce qui a changé, revenez à une version précédente et essayez des idées sur une branche. Git n'a pas besoin d'être installé.
help.version_control.how=Choisissez les fichiers à garder dans l'onglet Modifications, écrivez un message et appuyez sur Valider. L'historique liste les validations précédentes ; cliquez sur un fichier pour voir ce qui a changé. Le menu des branches change de branche ; Nouvelle branche en crée une depuis la validation actuelle.
help.version_control.related=La fenêtre Projet liste les fichiers ; le Terminal peut lancer git pour tout ce que cette fenêtre ne fait pas.

