[project]
name = "pafsk8"
version = "0.1.0"
description = "pafsk8 using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]==1.10.1"
]

[project.scripts]
pafsk8 = "pafsk8.main:run"
run_crew = "pafsk8.main:run"
train = "pafsk8.main:train"
replay = "pafsk8.main:replay"
test = "pafsk8.main:test"
run_with_trigger = "pafsk8.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
