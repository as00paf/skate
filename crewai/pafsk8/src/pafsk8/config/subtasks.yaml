subtasks:

  codebase_review:
    - name: "Review ECS architecture"
      description: "Analyze current entity-component-system implementation, identify critical issues, and note unstable or inconsistent parts."
      agents: [ tech_lead, software_engineer, reviewer ]
    - name: "Review physics system"
      description: "Examine physics integration, forces, collision detection, and identify any calculation errors or instability."
      agents: [ physics_engineer, reviewer ]
    - name: "Review animation and movement logic"
      description: "Check animation math, movement integration, and consistency across existing characters and objects."
      agents: [ software_engineer, physics_engineer, reviewer ]
    - name: "Document codebase findings"
      description: "Prepare a report summarizing the review with identified risks and opportunities for refactoring."
      agents: [ documentation_engineer, reviewer ]

  roadmap_definition:
    - name: "Define major engine milestones"
      description: "Break down the engine development roadmap into major features and critical fixes."
      agents: [ tech_lead, project_manager ]
    - name: "Identify immediate next tasks"
      description: "Based on codebase review, define the first set of actionable subtasks for the crew."
      agents: [ tech_lead, project_manager, po ]

  feature_development:
    - name: "Refactor ECS grid system"
      description: "Update grid system to behave like Godot’s grid, ensure proper ECS integration."
      agents: [ software_engineer, physics_engineer ]
    - name: "Stabilize physics calculations"
      description: "Fix inconsistencies and ensure realistic movement, jumping, and collision response."
      agents: [ physics_engineer ]
    - name: "Fix animation math issues"
      description: "Correct any inconsistencies with Mixamo or custom animations."
      agents: [ software_engineer, physics_engineer ]
    - name: "Implement small test features"
      description: "Implement simple engine features to validate ECS, physics, and animation improvements."
      agents: [ software_engineer, physics_engineer ]

  refactoring:
    - name: "Refactor critical code"
      description: "Aggressively refactor unstable or complex modules as identified in the review."
      agents: [ software_engineer, physics_engineer ]
    - name: "Schedule non-critical improvements"
      description: "Log minor code improvements and escalate to PO for prioritization."
      agents: [ tech_lead ]

  code_review:
    - name: "Review feature implementations"
      description: "Enforce coding standards, SOLID principles, and Clean Architecture for newly implemented features."
      agents: [ reviewer ]
    - name: "Enforce project conventions"
      description: "Check for proper null handling, dependency injection usage, localization, and idiomatic Kotlin."
      agents: [ reviewer ]

  testing:
    - name: "Test critical physics calculations"
      description: "Write or update unit tests for physics math and other critical systems."
      agents: [ qa_engineer ]
    - name: "Regression testing"
      description: "Verify that new changes did not break existing stable features."
      agents: [ qa_engineer ]

  documentation:
    - name: "Document stable ECS patterns"
      description: "Write documentation for ECS structures that are finalized and won’t change soon."
      agents: [ documentation_engineer ]
    - name: "Document physics engine conventions"
      description: "Explain forces, jumps, friction, and other critical parameters."
      agents: [ documentation_engineer, physics_engineer ]
    - name: "Document editor UI/UX guidelines"
      description: "Include finalized UI/UX components, layout, and interaction patterns."
      agents: [ documentation_engineer, ui_ux_designer, project_manager ]

  ui_ux_design:
    - name: "Propose editor layout"
      description: "Create a preliminary layout for the engine editor including panels, toolbars, and viewport."
      agents: [ ui_ux_designer ]
    - name: "Define input & interaction patterns"
      description: "Suggest standard input mappings, navigation, and interaction behavior."
      agents: [ ui_ux_designer, project_manager ]
    - name: "Create UI implementation notes"
      description: "Provide hints to software engineers for implementing the proposed UI components."
      agents: [ ui_ux_designer, project_manager ]

  integration_and_release:
    - name: "Merge feature branches"
      description: "Ensure all approved tasks are merged into master according to workflow rules."
      agents: [ project_manager, tech_lead, software_engineer ]
    - name: "Final integration testing"
      description: "Run tests and verify stability before release."
      agents: [ qa_engineer, reviewer ]
    - name: "Update CHANGELOG and semver"
      description: "Record new version using semantic versioning and summarize changes in the CHANGELOG."
      agents: [ project_manager, documentation_engineer ]