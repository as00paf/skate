# UI authoring (GUI-03)
context.create_ui=Interface
context.create_ui.canvas=Canevas
context.create_ui.canvas.tooltip=Créer un canevas UI, la racine qui affiche l'interface du jeu à l'écran.
context.create_ui.panel=Panneau
context.create_ui.panel.tooltip=Créer un panneau : un rectangle qui regroupe d'autres éléments UI et leur sert de fond.
context.create_ui.text=Texte
context.create_ui.text.tooltip=Créer un élément texte qui affiche une clé de chaîne traduite.
context.create_ui.image=Image
context.create_ui.image.tooltip=Créer un élément image qui affiche une texture ou un rectangle teinté.
context.create_ui.button=Bouton
context.create_ui.button.tooltip=Créer un bouton qui réagit à la souris, au clavier et à la manette.
context.create_ui.slider=Curseur
context.create_ui.slider.tooltip=Créer un curseur pour choisir une valeur entre un minimum et un maximum.
context.create_ui.progress_bar=Barre de progression
context.create_ui.progress_bar.tooltip=Créer une barre de progression qui se remplit de 0 à 1.
context.create_ui.list=Liste
context.create_ui.list.tooltip=Créer une liste défilante d'éléments texte.
ui.inspector.sortOrder=Ordre de tri
ui.inspector.sortOrder.tooltip=Ordre de dessin entre canevas ; les valeurs plus élevées passent devant et reçoivent les entrées en premier.
ui.inspector.scaleMode=Mode d'échelle
ui.inspector.scaleMode.tooltip=Conversion des unités du canevas en pixels : taille de pixel fixe, selon l'écran ou taille physique fixe.
ui.inspector.referenceWidth=Largeur de référence
ui.inspector.referenceWidth.tooltip=Largeur d'écran en pixels pour laquelle l'interface a été conçue, utilisée par le mode d'échelle selon l'écran.
ui.inspector.referenceHeight=Hauteur de référence
ui.inspector.referenceHeight.tooltip=Hauteur d'écran en pixels pour laquelle l'interface a été conçue, utilisée par le mode d'échelle selon l'écran.
ui.inspector.match=Correspondance
ui.inspector.match.tooltip=Mélange la mise à l'échelle entre la largeur (0) et la hauteur (1) de référence ; 0,5 équilibre les deux.
ui.inspector.visible=Visible
ui.inspector.visible.tooltip=Affiche ou masque cette interface et tous ses enfants.
ui.inspector.modal=Modal
ui.inspector.modal.tooltip=Activé, ce canevas capte toutes les entrées de navigation et garde le focus en lui.
ui.inspector.anchorMinX=Ancre min X
ui.inspector.anchorMinX.tooltip=Ancre gauche en fraction de la largeur du parent, de 0 (bord gauche) à 1 (bord droit).
ui.inspector.anchorMinY=Ancre min Y
ui.inspector.anchorMinY.tooltip=Ancre haute en fraction de la hauteur du parent, de 0 (bord haut) à 1 (bord bas).
ui.inspector.anchorMaxX=Ancre max X
ui.inspector.anchorMaxX.tooltip=Ancre droite en fraction de la largeur du parent, de 0 (bord gauche) à 1 (bord droit).
ui.inspector.anchorMaxY=Ancre max Y
ui.inspector.anchorMaxY.tooltip=Ancre basse en fraction de la hauteur du parent, de 0 (bord haut) à 1 (bord bas).
ui.inspector.pivotX=Pivot X
ui.inspector.pivotX.tooltip=Pivot horizontal en fraction de la largeur de l'élément : 0 gauche, 0,5 centre, 1 droite.
ui.inspector.pivotY=Pivot Y
ui.inspector.pivotY.tooltip=Pivot vertical en fraction de la hauteur de l'élément : 0 haut, 0,5 centre, 1 bas.
ui.inspector.x=X
ui.inspector.x.tooltip=Décalage horizontal par rapport au point d'ancrage, en unités du canevas ; positif vers la droite.
ui.inspector.y=Y
ui.inspector.y.tooltip=Décalage vertical par rapport au point d'ancrage, en unités du canevas ; positif vers le bas.
ui.inspector.width=Largeur
ui.inspector.width.tooltip=Largeur de l'élément en unités du canevas, ajoutée à l'écart entre les ancres horizontales.
ui.inspector.height=Hauteur
ui.inspector.height.tooltip=Hauteur de l'élément en unités du canevas, ajoutée à l'écart entre les ancres verticales.
ui.inspector.layout=Disposition
ui.inspector.layout.tooltip=Disposition automatique des enfants de cet élément : marges, espacement, alignement et grille.
ui.inspector.interactable=Interactif
ui.inspector.interactable.tooltip=Désactivé, l'élément ignore les clics et le focus, et les boutons prennent leur couleur désactivé.
ui.inspector.opacity=Opacité
ui.inspector.opacity.tooltip=Transparence de l'élément et de ses enfants, de 0 (invisible) à 1 (opaque).
ui.inspector.zOrder=Ordre Z
ui.inspector.zOrder.tooltip=Ordre de dessin parmi les éléments frères ; les valeurs plus élevées passent devant.
ui.inspector.key=Clé
ui.inspector.key.tooltip=Clé de localisation du texte affiché, résolue selon la langue courante à l'exécution.
ui.inspector.args=Arguments
ui.inspector.args.tooltip=Valeurs insérées dans les espaces réservés de la chaîne localisée, dans l'ordre.
ui.inspector.color=Couleur
ui.inspector.color.tooltip=Couleur du texte (RVBA) ; le canal alpha règle sa transparence.
ui.inspector.fontSize=Taille de police
ui.inspector.fontSize.tooltip=Hauteur de ligne du texte, en unités du canevas.
ui.inspector.alignX=Alignement X
ui.inspector.alignX.tooltip=Alignement horizontal de 0 (gauche) à 1 (droite) ; 0,5 centre le contenu.
ui.inspector.alignY=Alignement Y
ui.inspector.alignY.tooltip=Alignement vertical de 0 (haut) à 1 (bas) ; 0,5 centre le contenu.
ui.inspector.quantity=Quantité
ui.inspector.quantity.tooltip=Nombre servant à choisir la forme plurielle de la clé selon la langue ; laissez vide pour aucune.
ui.inspector.texturePath=Chemin de texture
ui.inspector.texturePath.tooltip=Fichier image dessiné dans l'élément ; laissez vide pour un rectangle plein de la couleur de teinte.
ui.inspector.tint=Teinte
ui.inspector.tint.tooltip=Couleur multipliée avec la texture, ou couleur de remplissage en l'absence de texture.
ui.inspector.sliceLeft=Découpe gauche
ui.inspector.sliceLeft.tooltip=Bordure gauche du 9-slice en pixels de texture ; cette bande ne s'étire pas au redimensionnement.
ui.inspector.sliceTop=Découpe haut
ui.inspector.sliceTop.tooltip=Bordure haute du 9-slice en pixels de texture ; cette bande ne s'étire pas au redimensionnement.
ui.inspector.sliceRight=Découpe droite
ui.inspector.sliceRight.tooltip=Bordure droite du 9-slice en pixels de texture ; cette bande ne s'étire pas au redimensionnement.
ui.inspector.sliceBottom=Découpe bas
ui.inspector.sliceBottom.tooltip=Bordure basse du 9-slice en pixels de texture ; cette bande ne s'étire pas au redimensionnement.
ui.inspector.labelKey=Clé du libellé
ui.inspector.labelKey.tooltip=Clé de localisation du texte affiché au centre du bouton.
ui.inspector.normalColor=Couleur normale
ui.inspector.normalColor.tooltip=Couleur de fond du bouton au repos, ni survolé ni appuyé.
ui.inspector.hoverColor=Couleur survol
ui.inspector.hoverColor.tooltip=Couleur de fond du bouton quand le pointeur le survole.
ui.inspector.pressedColor=Couleur appuyé
ui.inspector.pressedColor.tooltip=Couleur de fond du bouton pendant qu'il est cliqué ou activé.
ui.inspector.disabledColor=Couleur désactivé
ui.inspector.disabledColor.tooltip=Couleur de fond du bouton quand l'élément n'est pas interactif.
ui.inspector.focusColor=Couleur focus
ui.inspector.focusColor.tooltip=Couleur du contour affiché autour du bouton quand il a le focus clavier ou manette.
ui.inspector.labelColor=Couleur du libellé
ui.inspector.labelColor.tooltip=Couleur du texte du libellé affiché au centre du bouton, dans tous les états.
ui.inspector.min=Min
ui.inspector.min.tooltip=Valeur du curseur à son extrémité gauche ; la valeur actuelle ne descend jamais en dessous.
ui.inspector.max=Max
ui.inspector.max.tooltip=Valeur du curseur à son extrémité droite ; la valeur actuelle ne la dépasse jamais.
ui.inspector.value=Valeur
ui.inspector.value.tooltip=Valeur actuelle ; entre min et max pour un curseur, entre 0 et 1 pour une barre de progression.
ui.inspector.step=Pas
ui.inspector.step.tooltip=Incrément sur lequel la valeur du curseur s'aligne ; 0 autorise toute valeur entre min et max.
ui.inspector.trackColor=Couleur de piste
ui.inspector.trackColor.tooltip=Couleur de la piste du curseur, derrière la partie remplie.
ui.inspector.fillColor=Couleur de remplissage
ui.inspector.fillColor.tooltip=Couleur de la partie remplie de la barre, du minimum jusqu'à la valeur actuelle.
ui.inspector.direction=Direction
ui.inspector.direction.tooltip=Sens dans lequel la barre se remplit quand sa valeur passe de 0 à 1.
ui.inspector.backgroundColor=Couleur de fond
ui.inspector.backgroundColor.tooltip=Couleur de la partie vide de la barre de progression, derrière le remplissage.
ui.inspector.items=Éléments
ui.inspector.items.tooltip=Lignes affichées par la liste, chacune avec une clé de localisation et des arguments facultatifs.
ui.inspector.itemHeight=Hauteur d'élément
ui.inspector.itemHeight.tooltip=Hauteur de chaque ligne de la liste, en unités du canevas.
ui.inspector.selectedIndex=Index sélectionné
ui.inspector.selectedIndex.tooltip=Index, à partir de zéro, de la ligne actuellement sélectionnée.
ui.inspector.scroll=Défilement
ui.inspector.scroll.tooltip=Décalage de défilement vertical actuel de la liste, en unités du canevas.
ui.inspector.selectionColor=Couleur de sélection
ui.inspector.selectionColor.tooltip=Couleur de la surbrillance derrière la ligne sélectionnée.
ui.inspector.textColor=Couleur du texte
ui.inspector.textColor.tooltip=Couleur du texte de chaque ligne de la liste.
ui.inspector.kind=Type
ui.inspector.kind.tooltip=Façon d'organiser les enfants : aucune, pile verticale, pile horizontale ou grille.
ui.inspector.paddingLeft=Marge gauche
ui.inspector.paddingLeft.tooltip=Espace vide entre le bord gauche et les enfants disposés, en unités du canevas.
ui.inspector.paddingTop=Marge haut
ui.inspector.paddingTop.tooltip=Espace vide entre le bord haut et les enfants disposés, en unités du canevas.
ui.inspector.paddingRight=Marge droite
ui.inspector.paddingRight.tooltip=Espace vide entre le bord droit et les enfants disposés, en unités du canevas.
ui.inspector.paddingBottom=Marge bas
ui.inspector.paddingBottom.tooltip=Espace vide entre le bord bas et les enfants disposés, en unités du canevas.
ui.inspector.spacing=Espacement
ui.inspector.spacing.tooltip=Écart entre les enfants successifs ou les cellules de la grille, en unités du canevas.
ui.inspector.fillCross=Remplir l'axe croisé
ui.inspector.fillCross.tooltip=Étire les enfants sur tout l'axe croisé (largeur en disposition verticale, hauteur en horizontale).
ui.inspector.columns=Colonnes
ui.inspector.columns.tooltip=Nombre de colonnes de la grille ; les enfants remplissent les lignes de gauche à droite.
ui.inspector.cellWidth=Largeur de cellule
ui.inspector.cellWidth.tooltip=Largeur de chaque cellule de la grille, en unités du canevas.
ui.inspector.cellHeight=Hauteur de cellule
ui.inspector.cellHeight.tooltip=Hauteur de chaque cellule de la grille, en unités du canevas.
ui.inspector.anchorPreset=Préréglage d'ancre
ui.inspector.anchorPreset.tooltip=Applique une configuration d'ancres et de pivot courante, comme un coin, le centre ou l'étirement sur le parent.
ui.inspector.listItems=Éléments de liste
ui.inspector.listItems.tooltip=Modifiez les lignes de la liste : changez chaque clé, ajoutez ou retirez des lignes.
ui.inspector.add=Ajouter
ui.inspector.add.tooltip=Ajoute une nouvelle entrée à la fin de cette liste.
ui.inspector.remove=Retirer
ui.inspector.remove.tooltip=Retire cette entrée de la liste ; les entrées suivantes remontent.
ui.anchor.top_left=Haut gauche
ui.anchor.top_center=Haut centre
ui.anchor.top_right=Haut droite
ui.anchor.middle_left=Milieu gauche
ui.anchor.center=Centre
ui.anchor.middle_right=Milieu droite
ui.anchor.bottom_left=Bas gauche
ui.anchor.bottom_center=Bas centre
ui.anchor.bottom_right=Bas droite
ui.anchor.stretch=Étirer

# UI requirement hints (GUI-05)
ui.hint.no_element=Ce composant UI a besoin d'un UI Element (son rectangle) pour être affiché.
ui.hint.no_canvas=Aucun UI Canvas sur cet objet ou ses parents : rien n'est affiché.
ui.hint.fix=Ajouter le composant manquant
ui.hint.fix.tooltip=Ajoute le composant dont cet objet d'interface a besoin pour s'afficher. Peut être annulé.
