help.asset_store.what=Free 3D content libraries in one place: Poly Haven and ambientCG (downloaded for you), Kenney and Quaternius (curated packs you download from their site). Every import keeps its license and author in the project's attribution ledger.
help.asset_store.how=Pick a Source and a Type, search, and select an item to see its license. Import copies it into Assets/Store/<source>/<item>/ (undo removes it). For Kenney and Quaternius, open the pack's page, download the zip, then use Import downloaded pack. The Attribution tab lists what your game must credit.
