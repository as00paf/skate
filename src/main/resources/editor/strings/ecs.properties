# ECS area (EDT-36): generic inspector String fields and object picker
inspector.string_field.none=(none)
inspector.string_field.pick=Pick object
inspector.string_field.drop_hint=Type a name, or drop an object from the hierarchy here
inspector.string_field.missing=No object named "%s" in this scene
component.EnvironmentComponent.fogCycleButton=Fog Cycle Button
component.EnvironmentComponent.fogCycleButton.tooltip=Runtime UI button that steps through the fog demo presets when clicked in Play. Empty = none.
component.PlayerController.behaviorId=Behavior
component.PlayerController.behaviorId.tooltip=Registered character behavior that drives this player, such as locomotion.
component.PlayerController.configPath=Config Path
component.PlayerController.configPath.tooltip=Path to the config file holding the tuning for the selected behavior.
component.PlayerController.waterResponse=Water Response
component.PlayerController.waterResponse.tooltip=What entering water does to this player. None ignores it, Bail makes the player fall and respawn at the spawn point (or the Play start position).
component.Animator.controllerPath=Controller Path
component.Animator.controllerPath.tooltip=Animation controller JSON file whose state machine drives the pose. Empty = single-clip playback.
component.PrefabInstance.prefabId=Prefab Id
component.PrefabInstance.prefabId.tooltip=Prefab this instance follows. Only properties changed on the instance are stored as overrides.
component.NetworkIdentity.prefabId=Prefab Id
component.NetworkIdentity.prefabId.tooltip=Key clients use to spawn the matching prefab when this object is replicated.

# EDT-74: multi-selection
properties.multi.count=%d objects selected
properties.multi.hint=Only the components every selected object has are shown. A change applies to all of them.
properties.multi.none=The selected objects have no component in common
ctx.hierarchy.drag_tooltip_many=Move %d objects
command.CompositeCommand.delete=Delete %d objects
command.CompositeCommand.duplicate=Duplicate %d objects
command.CompositeCommand.reparent=Reparent %d objects
command.CompositeCommand.paste=Paste %d objects
command.CompositeCommand.edit=Edit %d components
component.GroundStateComponent.footOffset=Foot Offset
component.GroundStateComponent.footOffset.tooltip=Distance in metres from the object origin down to the feet.
component.GroundStateComponent.probeStartHeight=Probe Start Height
component.GroundStateComponent.probeStartHeight.tooltip=How far above the feet the ground rays start, so slightly sunken feet still find the ground.
component.GroundStateComponent.groundedDistance=Grounded Distance
component.GroundStateComponent.groundedDistance.tooltip=Feet within this distance of the ground count as grounded.
component.GroundStateComponent.snapDistance=Snap Distance
component.GroundStateComponent.snapDistance.tooltip=How far below the feet the ground is searched for snapping and slope sampling.
component.GroundStateComponent.sampleRadius=Sample Radius
component.GroundStateComponent.sampleRadius.tooltip=Horizontal radius of the extra rays used to estimate the surface normal.
component.GroundStateComponent.maxSlopeDeg=Max Slope
component.GroundStateComponent.maxSlopeDeg.tooltip=Steeper surfaces are not walkable: the character is airborne on them. In degrees.
component.GroundStateComponent.stepHeight=Step Height
component.GroundStateComponent.stepHeight.tooltip=Tallest step the character climbs without jumping, in metres.
component.GroundStateComponent.stepProbeDistance=Step Probe Distance
component.GroundStateComponent.stepProbeDistance.tooltip=How far ahead obstacles are checked for steps, in metres.
component.GroundStateComponent.maxSnapSpeed=Max Snap Speed
component.GroundStateComponent.maxSnapSpeed.tooltip=Vertical speed cap in m/s for snapping down and stepping up.
component.GroundStateComponent.snapToGround=Snap To Ground
component.GroundStateComponent.snapToGround.tooltip=Keeps the feet on the ground when walking down slopes.
component.GroundStateComponent.stepUp=Step Up
component.GroundStateComponent.stepUp.tooltip=Climbs steps up to the step height instead of stopping at them.
