# Audio source inspector (EDT-14)
btn.audio.add_component=Ajouter une source audio
btn.audio.add_component.tooltip=Ajoute un composant source audio au GameObject sélectionné. Peut être annulé.
btn.audio.remove_component=Retirer la source audio
btn.audio.remove_component.tooltip=Retire le composant source audio du GameObject sélectionné. Peut être annulé.
btn.audio.play=Lire
btn.audio.play.tooltip=Écoute un aperçu du son en mode édition. L'aperçu n'est pas enregistré avec la scène.
btn.audio.stop=Arrêter
btn.audio.stop.tooltip=Arrête l'aperçu du son en cours de lecture.
component.AudioComponent.soundFilePath=Fichier son
component.AudioComponent.soundFilePath.tooltip=Son à lire (WAV, OGG ou MP3). Déposez ici un son depuis le navigateur d'assets.
component.AudioComponent.clips=Clips aléatoires
component.AudioComponent.clips.tooltip=S'il y en a, un clip au hasard (jamais deux fois de suite le même) est lu à la place du fichier son.
component.AudioComponent.clips.drop=Déposez des sons ici
component.AudioComponent.clips.drop.tooltip=Faites glisser des sons depuis le navigateur d'assets sur cette zone pour les ajouter aux clips.
component.AudioComponent.bus=Bus
component.AudioComponent.bus.tooltip=Bus du mixeur auquel ce son est envoyé ; le volume et la sourdine du bus s'y appliquent.
component.AudioComponent.volume=Volume
component.AudioComponent.volume.tooltip=Volume de lecture de ce son, avant celui des bus. 0 = muet, 1 = plein volume.
component.AudioComponent.loops=Boucle
component.AudioComponent.loops.tooltip=Relance le son depuis le début chaque fois qu'il se termine.
component.AudioComponent.playOnAwake=Lire au démarrage
component.AudioComponent.playOnAwake.tooltip=Lance la lecture au démarrage de la scène (Lecture). À désactiver pour les sons déclenchés par un script.
component.AudioComponent.streamMode=Streaming
component.AudioComponent.streamMode.tooltip=AUTO lit en streaming les sons du bus Musique et les fichiers de plus de 1 Mo ; ALWAYS ou NEVER l'imposent.
component.AudioComponent.priority=Priorité
component.AudioComponent.priority.tooltip=De 0 à 255. Quand toutes les voix sont occupées, le son de plus haute priorité continue de jouer.
component.AudioComponent.is3D=3D (positionnel)
component.AudioComponent.is3D.tooltip=Son positionnel, atténué avec la distance et spatialisé. Désactivé = même volume partout.
component.AudioComponent.attenuationModel=Atténuation
component.AudioComponent.attenuationModel.tooltip=Courbe qui réduit le volume entre la distance min. et max. NONE garde le même volume à toute distance.
component.AudioComponent.minDistance=Distance min.
component.AudioComponent.minDistance.tooltip=Distance en mètres en deçà de laquelle le son est lu à plein volume.
component.AudioComponent.maxDistance=Distance max.
component.AudioComponent.maxDistance.tooltip=Distance en mètres au-delà de laquelle le volume cesse de diminuer.
component.AudioComponent.rolloff=Décroissance
component.AudioComponent.rolloff.tooltip=Vitesse à laquelle le volume diminue avec la distance. 0 = aucune baisse, plus élevé = baisse plus rapide.
component.AudioComponent.dopplerFactor=Doppler
component.AudioComponent.dopplerFactor.tooltip=Variation de hauteur due à la vitesse des corps physiques. 0 = désactivé. Jamais appliquée sur le bus Musique.
component.AudioComponent.dopplerFactor.music=Bus Musique : le Doppler est ignoré.
