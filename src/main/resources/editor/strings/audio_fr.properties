tooltip.audio.bus.volume=Volume du bus (0-1). Enregistré avec le projet.
tooltip.audio.bus.low_pass=Gain des hautes fréquences du bus : 1 = désactivé, plus bas = plus sourd. S'applique au bus et à ses enfants.
