# UI authoring (GUI-03)
context.create_ui=UI
context.create_ui.canvas=Canvas
context.create_ui.canvas.tooltip=Create a UI canvas, the root that draws runtime UI on screen.
context.create_ui.panel=Panel
context.create_ui.panel.tooltip=Create a panel: a rectangle that groups and backs other UI elements.
context.create_ui.text=Text
context.create_ui.text.tooltip=Create a text element that shows a translated string key.
context.create_ui.image=Image
context.create_ui.image.tooltip=Create an image element that draws a texture or a tinted rectangle.
context.create_ui.button=Button
context.create_ui.button.tooltip=Create a button that reacts to mouse, keyboard and gamepad.
context.create_ui.slider=Slider
context.create_ui.slider.tooltip=Create a slider to pick a value between a minimum and a maximum.
context.create_ui.progress_bar=Progress Bar
context.create_ui.progress_bar.tooltip=Create a progress bar that fills from 0 to 1.
context.create_ui.list=List
context.create_ui.list.tooltip=Create a scrollable list of text items.
ui.inspector.sortOrder=Sort order
ui.inspector.sortOrder.tooltip=Drawing order between canvases; higher values are drawn on top and receive input first.
ui.inspector.scaleMode=Scale mode
ui.inspector.scaleMode.tooltip=How canvas units map to screen pixels: constant pixel size, scale with screen or constant physical size.
ui.inspector.referenceWidth=Reference width
ui.inspector.referenceWidth.tooltip=Screen width in pixels the UI was designed for, used by scale with screen mode.
ui.inspector.referenceHeight=Reference height
ui.inspector.referenceHeight.tooltip=Screen height in pixels the UI was designed for, used by scale with screen mode.
ui.inspector.match=Match
ui.inspector.match.tooltip=Blends scaling between matching the reference width (0) and height (1); 0.5 balances both.
ui.inspector.visible=Visible
ui.inspector.visible.tooltip=Shows or hides this UI and all of its children.
ui.inspector.modal=Modal
ui.inspector.modal.tooltip=When on, this canvas captures all navigation input and keeps focus inside it.
ui.inspector.anchorMinX=Anchor min x
ui.inspector.anchorMinX.tooltip=Left anchor as a fraction of the parent width, from 0 (left edge) to 1 (right edge).
ui.inspector.anchorMinY=Anchor min y
ui.inspector.anchorMinY.tooltip=Top anchor as a fraction of the parent height, from 0 (top edge) to 1 (bottom edge).
ui.inspector.anchorMaxX=Anchor max x
ui.inspector.anchorMaxX.tooltip=Right anchor as a fraction of the parent width, from 0 (left edge) to 1 (right edge).
ui.inspector.anchorMaxY=Anchor max y
ui.inspector.anchorMaxY.tooltip=Bottom anchor as a fraction of the parent height, from 0 (top edge) to 1 (bottom edge).
ui.inspector.pivotX=Pivot x
ui.inspector.pivotX.tooltip=Horizontal pivot as a fraction of the element width: 0 left, 0.5 center, 1 right.
ui.inspector.pivotY=Pivot y
ui.inspector.pivotY.tooltip=Vertical pivot as a fraction of the element height: 0 top, 0.5 center, 1 bottom.
ui.inspector.x=X
ui.inspector.x.tooltip=Horizontal offset from the anchor point in canvas units; positive values move right.
ui.inspector.y=Y
ui.inspector.y.tooltip=Vertical offset from the anchor point in canvas units; positive values move down.
ui.inspector.width=Width
ui.inspector.width.tooltip=Element width in canvas units, added to the span between the horizontal anchors.
ui.inspector.height=Height
ui.inspector.height.tooltip=Element height in canvas units, added to the span between the vertical anchors.
ui.inspector.layout=Layout
ui.inspector.layout.tooltip=Automatic layout applied to this element's children: padding, spacing, alignment and grid cells.
ui.inspector.interactable=Interactable
ui.inspector.interactable.tooltip=When off, the element ignores clicks and focus and buttons use their disabled color.
ui.inspector.opacity=Opacity
ui.inspector.opacity.tooltip=Transparency of the element and its children, from 0 (invisible) to 1 (opaque).
ui.inspector.zOrder=Z order
ui.inspector.zOrder.tooltip=Drawing order among sibling elements; higher values are drawn on top.
ui.inspector.key=Key
ui.inspector.key.tooltip=Localization key of the displayed text, resolved for the current language at runtime.
ui.inspector.args=Args
ui.inspector.args.tooltip=Values inserted into the placeholders of the localized string, in order.
ui.inspector.color=Color
ui.inspector.color.tooltip=Text color (RGBA); the alpha channel controls its transparency.
ui.inspector.fontSize=Font size
ui.inspector.fontSize.tooltip=Line height of the text in canvas units.
ui.inspector.alignX=Align x
ui.inspector.alignX.tooltip=Horizontal alignment from 0 (left) to 1 (right); 0.5 centers the content.
ui.inspector.alignY=Align y
ui.inspector.alignY.tooltip=Vertical alignment from 0 (top) to 1 (bottom); 0.5 centers the content.
ui.inspector.quantity=Quantity
ui.inspector.quantity.tooltip=Count used to pick the plural form of the key for the current language; leave empty for none.
ui.inspector.texturePath=Texture path
ui.inspector.texturePath.tooltip=Image file drawn in the element; leave empty to draw a solid rectangle in the tint color.
ui.inspector.tint=Tint
ui.inspector.tint.tooltip=Color multiplied with the texture, or the fill color when no texture is set.
ui.inspector.sliceLeft=Slice left
ui.inspector.sliceLeft.tooltip=Left 9-slice border in texture pixels; that strip does not stretch when resized.
ui.inspector.sliceTop=Slice top
ui.inspector.sliceTop.tooltip=Top 9-slice border in texture pixels; that strip does not stretch when resized.
ui.inspector.sliceRight=Slice right
ui.inspector.sliceRight.tooltip=Right 9-slice border in texture pixels; that strip does not stretch when resized.
ui.inspector.sliceBottom=Slice bottom
ui.inspector.sliceBottom.tooltip=Bottom 9-slice border in texture pixels; that strip does not stretch when resized.
ui.inspector.labelKey=Label key
ui.inspector.labelKey.tooltip=Localization key of the text shown centered on the button.
ui.inspector.normalColor=Normal color
ui.inspector.normalColor.tooltip=Button background color when idle, not hovered or pressed.
ui.inspector.hoverColor=Hover color
ui.inspector.hoverColor.tooltip=Button background color while the pointer is over it.
ui.inspector.pressedColor=Pressed color
ui.inspector.pressedColor.tooltip=Button background color while it is being clicked or activated.
ui.inspector.disabledColor=Disabled color
ui.inspector.disabledColor.tooltip=Button background color while the element is not interactable.
ui.inspector.focusColor=Focus color
ui.inspector.focusColor.tooltip=Color of the highlight drawn around the button when it has keyboard or gamepad focus.
ui.inspector.labelColor=Label color
ui.inspector.labelColor.tooltip=Color of the label text drawn centered on the button, in every state.
ui.inspector.min=Min
ui.inspector.min.tooltip=Value of the slider at its left end; the current value never goes below it.
ui.inspector.max=Max
ui.inspector.max.tooltip=Value of the slider at its right end; the current value never goes above it.
ui.inspector.value=Value
ui.inspector.value.tooltip=Current value; for a slider it stays between min and max, for a progress bar between 0 and 1.
ui.inspector.step=Step
ui.inspector.step.tooltip=Increment the slider value snaps to; 0 allows any value between min and max.
ui.inspector.trackColor=Track color
ui.inspector.trackColor.tooltip=Color of the slider track behind the filled part.
ui.inspector.fillColor=Fill color
ui.inspector.fillColor.tooltip=Color of the filled part of the bar, from the minimum up to the current value.
ui.inspector.direction=Direction
ui.inspector.direction.tooltip=Direction in which the progress bar fills as its value goes from 0 to 1.
ui.inspector.backgroundColor=Background color
ui.inspector.backgroundColor.tooltip=Color of the empty part of the progress bar behind the fill.
ui.inspector.items=Items
ui.inspector.items.tooltip=Rows shown by the list, each with a localization key and optional arguments.
ui.inspector.itemHeight=Item height
ui.inspector.itemHeight.tooltip=Height of each list row in canvas units.
ui.inspector.selectedIndex=Selected index
ui.inspector.selectedIndex.tooltip=Zero-based index of the currently selected row.
ui.inspector.scroll=Scroll
ui.inspector.scroll.tooltip=Current vertical scroll offset of the list in canvas units.
ui.inspector.selectionColor=Selection color
ui.inspector.selectionColor.tooltip=Color of the highlight behind the selected row.
ui.inspector.textColor=Text color
ui.inspector.textColor.tooltip=Color of the text drawn in each list row, selected or not.
ui.inspector.kind=Kind
ui.inspector.kind.tooltip=How children are arranged: none, vertical stack, horizontal stack or grid.
ui.inspector.paddingLeft=Padding left
ui.inspector.paddingLeft.tooltip=Empty space between the left edge and the laid-out children, in canvas units.
ui.inspector.paddingTop=Padding top
ui.inspector.paddingTop.tooltip=Empty space between the top edge and the laid-out children, in canvas units.
ui.inspector.paddingRight=Padding right
ui.inspector.paddingRight.tooltip=Empty space between the right edge and the laid-out children, in canvas units.
ui.inspector.paddingBottom=Padding bottom
ui.inspector.paddingBottom.tooltip=Empty space between the bottom edge and the laid-out children, in canvas units.
ui.inspector.spacing=Spacing
ui.inspector.spacing.tooltip=Gap between consecutive children or grid cells, in canvas units.
ui.inspector.fillCross=Fill cross
ui.inspector.fillCross.tooltip=Stretches children to fill the full cross axis (width in a vertical layout, height in a horizontal one).
ui.inspector.columns=Columns
ui.inspector.columns.tooltip=Number of columns in the grid layout; children fill rows left to right.
ui.inspector.cellWidth=Cell width
ui.inspector.cellWidth.tooltip=Width of each grid cell in canvas units.
ui.inspector.cellHeight=Cell height
ui.inspector.cellHeight.tooltip=Height of each grid cell in canvas units.
ui.inspector.anchorPreset=Anchor preset
ui.inspector.anchorPreset.tooltip=Applies a common anchor and pivot setup, such as a corner, the center or stretch to fill the parent.
ui.inspector.listItems=List items
ui.inspector.listItems.tooltip=Edit the list rows: change each key, add new rows or remove existing ones.
ui.inspector.add=Add
ui.inspector.add.tooltip=Appends a new entry at the end of this list.
ui.inspector.remove=Remove
ui.inspector.remove.tooltip=Removes this entry from the list; the remaining entries move up.
ui.anchor.top_left=Top Left
ui.anchor.top_center=Top Center
ui.anchor.top_right=Top Right
ui.anchor.middle_left=Middle Left
ui.anchor.center=Center
ui.anchor.middle_right=Middle Right
ui.anchor.bottom_left=Bottom Left
ui.anchor.bottom_center=Bottom Center
ui.anchor.bottom_right=Bottom Right
ui.anchor.stretch=Stretch

# UI requirement hints (GUI-05)
ui.hint.no_element=This UI component needs a UI Element (its rect) to be drawn.
ui.hint.no_canvas=No UI Canvas on this object or its parents, so nothing is drawn.
ui.hint.fix=Add missing component
ui.hint.fix.tooltip=Adds the component this UI object needs to display. Can be undone.
